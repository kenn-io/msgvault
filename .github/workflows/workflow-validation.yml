name: Workflow validation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: step-security/jactionlint@v2.2.0
        with:
          version: 2.3.0
          profile: correctness
          online: "false"
          args: --shellcheck= --pyflakes=
          working-directory: ${{ github.workspace }}

  # The organization requires SHA-pinned actions. actions.lock pins every
  # action, including ones that other actions call, so a stale lockfile fails
  # jobs at setup.
  actions-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify the workflow action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: make actions-lock-check
