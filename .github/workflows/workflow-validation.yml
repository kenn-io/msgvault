name: Workflow validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: step-security/jactionlint@30b636b51bcfb8cd8404be70a661f28e5564466d # v2.2.0
        with:
          version: 2.3.0
          profile: correctness
          online: "false"
          args: --shellcheck= --pyflakes=
          working-directory: ${{ github.workspace }}

  # The organization requires SHA-pinned actions. actions.lock pins every
  # action, including ones that other actions call, so a stale lockfile fails
  # jobs at setup.
  actions-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the workflow action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: make actions-lock-check
