name: Property discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.53.2
      - name: Install SQLite development headers
        run: kit-retry 3 5 sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev
      - name: Run properties with a fresh seed
        shell: bash
        run: |
          set -o pipefail
          seed="$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')"
          checks=10000
          mkdir -p property-discovery
          {
            echo "SHA: $(git rev-parse HEAD)"
            echo "rapid.seed=$seed"
            echo "rapid.checks=$checks"
          } | tee property-discovery/run.txt >> "$GITHUB_STEP_SUMMARY"
          go test -json -tags "fts5 sqlite_vec" -count=1 -run '^TestProperty(AnnualTemperatureRollups|MessageIDContract)$' ./internal/identityindex ./internal/imap -rapid.seed="$seed" -rapid.checks="$checks" 2>&1 | tee property-discovery/test.json
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: property-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            property-discovery/
            internal/**/testdata/rapid/
          retention-days: 14
