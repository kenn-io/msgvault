name: Docker

on:
  workflow_dispatch:
  workflow_call:

permissions: read-all

jobs:
  # PR validation: build and smoke-test only, no registry access
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4

      - name: Build browser application
        run: make web-assets-check

      - name: Build amd64 image
        uses: step-security/docker-build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: msgvault:test
          build-args: |
            VERSION=test
            COMMIT=${{ github.sha }}
            BUILD_DATE=test

      - name: Smoke test (amd64)
        run: scripts/smoke-container.sh msgvault:test
