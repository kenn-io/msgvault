name: Frontend shell commands

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  windows-shell:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version-file: web/package.json
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Test Command Prompt quoting and provider commands
        working-directory: web
        run: bun run test src/lib/settings/shell-quote.test.ts src/lib/components/settings/CardDAVAccountSettings.test.ts
