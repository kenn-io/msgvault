name: Frontend shell commands

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/frontend-shell.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-shell:
    runs-on: namespace-profile-windows-8cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Test Command Prompt quoting and provider commands
        working-directory: web
        run: bun run test src/lib/settings/shell-quote.test.ts src/lib/components/settings/CardDAVAccountSettings.test.ts
