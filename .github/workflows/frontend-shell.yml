name: Frontend shell commands

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/frontend-shell.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-shell:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: step-security/setup-bun@f6f5dadeac34f70c7828f731569e8d6e8330b8fb # v2.1.3
        with:
          bun-version-file: web/package.json
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Test Command Prompt quoting and provider commands
        working-directory: web
        run: bun run test src/lib/settings/shell-quote.test.ts src/lib/components/settings/CardDAVAccountSettings.test.ts
