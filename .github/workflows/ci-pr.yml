name: CI

# Run the PR's workflow revision so CI changes are exercised before merge.
on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    cache-mode: read
    uses: ./.github/workflows/ci.yml

  gate:
    name: CI gate
    needs: run
    if: always()
    runs-on: namespace-profile-linux-1cpu
    steps:
      - name: Check CI result
        if: needs.run.result != 'success'
        run: exit 1
