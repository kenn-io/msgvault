name: CI

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct
  GOTRACEBACK: all
  GOFLAGS: -trimpath

on:
  workflow_dispatch:

jobs:
  test-macos-15:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: macos
      - name: Exercise slow-body deadlines
        run: |
          make -f Makefile -f - focused <<'MAKE'
          .PHONY: focused
          focused: ; $(call gotestsum,protective-read-macos,./internal/api,-timeout 5m -tags "$(BUILD_TAGS)" -run '^TestMarkedCLIProtectiveRouteCanReadBodyPastOrdinaryServerTimeout$$' -count=100)
          MAKE
      - name: Upload test events
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: protective-read-macos
          path: gotestsum/protective-read-macos.json
          retention-days: 14
