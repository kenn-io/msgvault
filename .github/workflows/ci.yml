name: Go cache warm readers
permissions:
  contents: read
  actions: read
env:
  GOPROXY: https://proxy.golang.org|direct
  GOTRACEBACK: all
  GOFLAGS: -trimpath
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 38
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Free measurement space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@f2b96b0926d8d23a20bb64d159ee7260295e4856
      with:
        group: linux-test
      if: matrix.variant == 'baseline'
    - name: Require a warm exact cache hit
      shell: bash
      run: |
        echo "CACHE_MEASUREMENT_HIT=$GO_CACHE_HIT"
        echo "CACHE_MEASUREMENT_KEY=$GO_CACHE_KEY"
        test "$GO_CACHE_HIT" = true
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install SQLite development headers
      run: kit-retry 3 5 sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev
    - &id001
      name: Stabilize tracked file times
      run: go run ./scripts/stable-mtimes
    - name: Test
      run: make test-unsharded TEST_TIMEOUT=17m
    - name: Check for test reruns
      if: always()
      id: check-unsharded-reruns
      shell: bash
      run: |
        if [ -s gotestsum/unsharded-reruns.txt ]; then
          echo "reruns=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload test events
      if: failure() || github.run_attempt > 1 || steps.check-unsharded-reruns.outputs.reruns == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-unsharded-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/unsharded.json
        retention-days: 14
        if-no-files-found: ignore
    - name: Test build without vector backends
      run: go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/vector-stub.json --rerun-fails=2 --rerun-fails-report gotestsum/vector-stub-reruns.txt --packages ./cmd/msgvault/cmd -- -timeout 5m -tags fts5 -run '^TestDocumentVectorStubKeepsStatusAvailableAndBuildActionable$' -count=1
    - name: Check for test reruns
      if: always()
      id: check-vector-stub-reruns
      shell: bash
      run: |
        if [ -s gotestsum/vector-stub-reruns.txt ]; then
          echo "reruns=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload test events
      if: failure() || github.run_attempt > 1 || steps.check-vector-stub-reruns.outputs.reruns == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-vector-stub-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/vector-stub.json
        retention-days: 14
        if-no-files-found: ignore
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', inputs.variant || 'candidate')) }}
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
    if: inputs.group == 'linux'
  test-sharded:
    if: inputs.group == 'linux'
    name: test-sharded (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', inputs.variant || 'candidate')) }}
        name:
        - cli
        - store
        - api
        include:
        - name: cli
          package: ./cmd/msgvault/cmd
          job_timeout: 22
          test_timeout: 15m
        - name: store
          package: ./internal/store
          job_timeout: 17
          test_timeout: 10m
        - name: api
          package: ./internal/api
          job_timeout: 13
          test_timeout: 5m
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.job_timeout }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Free measurement space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@f2b96b0926d8d23a20bb64d159ee7260295e4856
      with:
        group: linux-test
      if: matrix.variant == 'baseline'
    - name: Require a warm exact cache hit
      shell: bash
      run: |
        echo "CACHE_MEASUREMENT_HIT=$GO_CACHE_HIT"
        echo "CACHE_MEASUREMENT_KEY=$GO_CACHE_KEY"
        test "$GO_CACHE_HIT" = true
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install test dependencies
      run: kit-retry 3 5 sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev bubblewrap
    - name: Test package in isolated shards
      run: scripts/test-package-shards.sh "${{ matrix.package }}" 4 "fts5 sqlite_vec" "${{ matrix.test_timeout }}" "sharded-${{ matrix.name }}"
    - name: Upload test events
      if: failure() || github.run_attempt > 1
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-sharded-${{ matrix.name }}-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/*.json
        retention-days: 14
        if-no-files-found: ignore
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
  frontend:
    if: inputs.group == 'linux'
    runs-on: ubuntu-26.04
    timeout-minutes: 33
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Free measurement space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@f2b96b0926d8d23a20bb64d159ee7260295e4856
      with:
        group: linux-test
      if: matrix.variant == 'baseline'
    - name: Require a warm exact cache hit
      shell: bash
      run: |
        echo "CACHE_MEASUREMENT_HIT=$GO_CACHE_HIT"
        echo "CACHE_MEASUREMENT_KEY=$GO_CACHE_KEY"
        test "$GO_CACHE_HIT" = true
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 26.13.0
    - uses: step-security/setup-bun@v2.1.3
      with:
        bun-version-file: web/package.json
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install frontend dependencies
      run: DOWNLOAD_RETRY='kit-retry 3 5' make web-install
    - name: Start browser server
      id: browser-server
      timeout-minutes: 10
      working-directory: web
      run: |
        version=$(node -p "require('@playwright/test/package.json').version")
        image="mcr.microsoft.com/playwright:v$version-noble"
        cli=$(node -p "require.resolve('@playwright/test/cli')")
        kit-retry 3 5 docker pull "$image"
        container_id=$(docker run --detach --interactive --init --network host --ipc host \
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
          --workdir "$GITHUB_WORKSPACE/web" \
          "$image" node "$cli" run-server --host 127.0.0.1 --port 3000)
        echo "container_id=$container_id" >> "$GITHUB_OUTPUT"
        # Allow slow container startup to finish while polling for readiness.
        for attempt in {1..120}; do
          if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
            echo 'Browser server container exited before becoming ready.' >&2
            exit 1
          fi
          # workflowretry: allow Poll the local service for readiness.
          if curl --fail --silent --output /dev/null --max-time 2 http://127.0.0.1:3000/json; then
            exit 0
          fi
          sleep 1
        done
        echo 'Browser server did not become ready within 120 attempts.' >&2
        exit 1
    - name: Check and test frontend
      run: make web-check web-test
    - name: Upload Vitest report
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: vitest-unit-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: web/test-results/vitest/unit.json
        retention-days: 14
        if-no-files-found: ignore
    - name: Precompile e2e archive fixture
      run: go test -tags "fts5 sqlite_vec" -run '^$' -count=1 ./internal/query
    - name: Run deterministic browser and visual tests
      env:
        PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
        MSGVAULT_PLAYWRIGHT_SUITE: browser
      run: make web-test-browser
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: playwright-browser-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: web/test-results/playwright/browser.json
        retention-days: 14
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v7.0.2
      if: failure()
      with:
        name: playwright-browser-failures-${{ matrix.variant }}
        path: |
          web/playwright-report
          web/test-results
        if-no-files-found: ignore
    - name: Stop browser server
      if: always() && steps.browser-server.outputs.container_id != ''
      env:
        CONTAINER_ID: ${{ steps.browser-server.outputs.container_id }}
      run: |
        docker logs "$CONTAINER_ID" || true
        docker rm --force "$CONTAINER_ID"
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', inputs.variant || 'candidate')) }}
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
  test-windows:
    runs-on: windows-2025
    timeout-minutes: 47
    steps:
    - uses: actions/checkout@v7.0.1
    - &id002
      name: Set cache and scratch paths
      shell: pwsh
      run: |
        $paths = @{ GOCACHE = 'go-build'; GOMODCACHE = 'go-mod'; GOTMPDIR = 'go-tmp'; TEMP = 'test-tmp'; TMP = 'test-tmp'; GOLANGCI_LINT_CACHE = 'golangci-lint' }
        foreach ($entry in $paths.GetEnumerator()) {
          $path = Join-Path $env:RUNNER_TEMP $entry.Value
          New-Item -ItemType Directory -Force -Path $path | Out-Null
          "$($entry.Key)=$path" >> $env:GITHUB_ENV
        }
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@f2b96b0926d8d23a20bb64d159ee7260295e4856
      with:
        group: windows
      if: matrix.variant == 'baseline'
    - name: Require a warm exact cache hit
      shell: bash
      run: |
        echo "CACHE_MEASUREMENT_HIT=$GO_CACHE_HIT"
        echo "CACHE_MEASUREMENT_KEY=$GO_CACHE_KEY"
        test "$GO_CACHE_HIT" = true
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install SQLite development headers
      shell: bash
      run: kit-retry 3 5 C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
    - name: Build
      shell: pwsh
      env:
        CGO_ENABLED: '1'
        CGO_CFLAGS: -IC:/msys64/mingw64/include -fgnu89-inline
        CGO_LDFLAGS: -Wl,--allow-multiple-definition
      run: go build -tags "fts5 sqlite_vec" -o msgvault.exe ./cmd/msgvault
    - *id001
    - name: Test
      shell: pwsh
      env:
        CGO_ENABLED: '1'
        CGO_CFLAGS: -IC:/msys64/mingw64/include -fgnu89-inline
        CGO_LDFLAGS: -Wl,--allow-multiple-definition
      run: |
        $separatePackages = @(
          "go.kenn.io/msgvault/cmd/msgvault/cmd"
          "go.kenn.io/msgvault/internal/api"
          "go.kenn.io/msgvault/internal/importer"
          "go.kenn.io/msgvault/internal/store"
          "go.kenn.io/msgvault/internal/sync"
          "go.kenn.io/msgvault/internal/vector/embed"
          "go.kenn.io/msgvault/internal/vector/sqlitevec"
          "go.kenn.io/msgvault/scripts"
        )
        $packages = go list -tags "fts5 sqlite_vec" ./... |
          Where-Object { $_ -notin $separatePackages }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/windows.json --rerun-fails=2 --rerun-fails-report gotestsum/windows-reruns.txt `
          --packages "$packages" -- -timeout 20m -tags "fts5 sqlite_vec"
    - name: Upload test events
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-windows-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/*.json
        retention-days: 14
        if-no-files-found: ignore
    - name: Print slowest tests
      if: always()
      shell: bash
      run: |
        for f in gotestsum/*.json; do
          [ -f "$f" ] || continue
          go tool gotestsum tool slowest --jsonfile "$f" --num 10 || true
        done
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: msgvault-windows-amd64-${{ matrix.variant }}
        path: msgvault.exe
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', inputs.variant || 'candidate')) }}
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
    if: inputs.group == 'windows'
  lint-windows:
    if: inputs.group == 'windows'
    runs-on: windows-2025
    timeout-minutes: 64
    steps:
    - uses: actions/checkout@v7.0.1
    - *id002
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@f2b96b0926d8d23a20bb64d159ee7260295e4856
      with:
        group: windows
      if: matrix.variant == 'baseline'
    - name: Require a warm exact cache hit
      shell: bash
      run: |
        echo "CACHE_MEASUREMENT_HIT=$GO_CACHE_HIT"
        echo "CACHE_MEASUREMENT_KEY=$GO_CACHE_KEY"
        test "$GO_CACHE_HIT" = true
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install SQLite development headers
      shell: bash
      run: kit-retry 3 5 C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
    - name: Build custom linter
      shell: pwsh
      env: &id003
        CGO_ENABLED: '1'
        CGO_CFLAGS: -IC:/msys64/mingw64/include -fgnu89-inline
        CGO_LDFLAGS: -Wl,--allow-multiple-definition
        GOFLAGS: -buildvcs=false -trimpath
      run: |
        $version = (Select-String -Path .custom-gcl.yml -Pattern '^version: (\S+)').Matches[0].Groups[1].Value
        bash -c 'kit-retry 3 5 go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$1" custom --destination "$2" --name custom-gcl' -- "$version" "$env:RUNNER_TEMP"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Lint
      shell: pwsh
      env: *id003
      run: '& "$env:RUNNER_TEMP/custom-gcl.exe" run -v ./...'
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', inputs.variant || 'candidate')) }}
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
  test-pgvector:
    if: inputs.group == 'linux'
    runs-on: ubuntu-26.04
    timeout-minutes: 109
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: -c max_locks_per_transaction=256 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports:
        - 5432:5432
        options: --tmpfs /var/lib/postgresql/data:rw,size=4g --health-cmd "pg_isready -U msgvault_test -d msgvault_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:testpw@localhost:5432/msgvault_test
      MEASURE_VARIANT: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Free measurement space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@f2b96b0926d8d23a20bb64d159ee7260295e4856
      with:
        group: linux-test
      if: matrix.variant == 'baseline'
    - name: Require a warm exact cache hit
      shell: bash
      run: |
        echo "CACHE_MEASUREMENT_HIT=$GO_CACHE_HIT"
        echo "CACHE_MEASUREMENT_KEY=$GO_CACHE_KEY"
        test "$GO_CACHE_HIT" = true
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install test dependencies
      run: kit-retry 3 5 sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev bubblewrap
    - name: Enable pgvector extension
      run: |
        docker exec "${{ job.services.postgres.id }}" \
          psql -U msgvault_test -d msgvault_test \
          -c "CREATE EXTENSION IF NOT EXISTS vector"
    - name: Test (pgvector-tagged)
      run: go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/pgvector.json --rerun-fails=2 --rerun-fails-report gotestsum/pgvector-reruns.txt --packages "./internal/vector/... ./internal/scheduler/..." -- -timeout 82m -p 4 -tags "fts5 sqlite_vec pgvector" -count=1
    - name: Check for test reruns
      if: always()
      id: check-pgvector-reruns
      shell: bash
      run: |
        if [ -s gotestsum/pgvector-reruns.txt ]; then
          echo "reruns=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload test events
      if: failure() || github.run_attempt > 1 || steps.check-pgvector-reruns.outputs.reruns == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-pgvector-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/pgvector.json
        retention-days: 14
        if-no-files-found: ignore
    - name: Test package in isolated shards (pgvector-tagged)
      if: ${{ !cancelled() }}
      run: scripts/test-package-shards.sh ./cmd/msgvault/cmd 4 "fts5 sqlite_vec pgvector" 18m pgvector-cli
    - name: Upload test events
      if: failure() || github.run_attempt > 1
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-pgvector-cli-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/pgvector-cli.json
        retention-days: 14
        if-no-files-found: ignore
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', inputs.variant || 'candidate')) }}
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        options:
        - baseline
        default: baseline
      subset:
        type: choice
        options:
        - core
        - shared
        - all
        default: core
      sample:
        type: string
        default: manual
      group:
        type: choice
        options:
        - linux
        - windows
        default: linux
  workflow_call:
    inputs:
      variant:
        type: string
        default: baseline
      subset:
        type: string
        default: core
      sample:
        type: string
        default: pr
      group:
        type: string
        default: linux
run-name: Go cache ${{ inputs.variant }} / ${{ inputs.group }} / ${{ inputs.sample }}
cache-mode: read
