name: Export Go cache snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: windows, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free export space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Use cache owner paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "GOCACHE=$env:RUNNER_TEMP/go-build" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP/go-mod" >> $env:GITHUB_ENV
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: ${{ matrix.group }}
          extra-path: ${{ matrix.group == 'linux-checks' && '.git/golangci-lint-cache' || '' }}
      - name: Archive restored directories
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tarfile
          paths = json.loads(subprocess.check_output(['go', 'env', '-json', 'GOCACHE', 'GOMODCACHE'], text=True))
          roots = {'build': paths['GOCACHE'], 'modules': paths['GOMODCACHE']}
          if os.environ['GROUP'] == 'linux-checks':
              roots['extra'] = '.git/golangci-lint-cache'
          out = Path(os.environ['RUNNER_TEMP']) / 'snapshot'
          out.mkdir()
          archive = out / 'cache.tar.zst'
          zstd = shutil.which('zstd')
          if not zstd:
              zstd = 'C:/Program Files/Git/usr/bin/zstd.exe'
          with archive.open('wb') as target:
              process = subprocess.Popen([zstd, '-T2', '-3', '-c'], stdin=subprocess.PIPE, stdout=target)
              with tarfile.open(fileobj=process.stdin, mode='w|', format=tarfile.PAX_FORMAT) as tar:
                  for name, root in roots.items():
                      if not Path(root).is_dir():
                          raise RuntimeError(f'Missing restored directory: {name}')
                      tar.add(root, arcname=name)
              process.stdin.close()
              if process.wait(timeout=1200):
                  raise RuntimeError('zstd failed')
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          metadata = {'group': os.environ['GROUP'], 'key': os.environ['GO_CACHE_KEY'], 'exact_hit': os.environ['GO_CACHE_HIT'], 'archive_bytes': archive.stat().st_size, 'sha256': digest, 'source_run': os.environ['GITHUB_RUN_ID']}
          (out / 'manifest.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata))
          PYTHON
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: go-snapshot-${{ matrix.group }}
          path: ${{ runner.temp }}/snapshot/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
