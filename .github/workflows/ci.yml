name: CI

permissions:
  contents: read

# The | separator falls back to the module's source repo on any proxy error, not just 404/410.
env:
  GOPROXY: https://proxy.golang.org|direct
  GOTRACEBACK: all
  # Compile without absolute source paths, like the Makefile does.
  GOFLAGS: -trimpath

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
jobs:
  changes:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      groups: ${{ steps.changes.outputs.groups }}
      all: ${{ steps.changes.outputs.all }}
    steps:
      - uses: kenn-io/actions/changes@e7ba4b0b573de976989328726cdcc83f8a463367
        id: changes
        with:
          filters: |
            go:
              - '!{web/**,docs/**,*.md}'
              - 'docs/assets/**'
              - 'docs/screenshots/**'
              - 'docs/*.go'
              - 'docs/guides/agent-quickstart.md'
              - 'web/src/lib/settings/cron-corpus.json'
              - 'web/tests/e2e/fixtures/operations-public.json'
              - 'web/tests/e2e/fixtures/operations-private-sentinels.json'
            frontend:
              - '!{docs/**,*.md}'

  gate:
    name: CI gate
    needs: changes
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Check CI result
        if: needs.changes.result != 'success'
        run: exit 1
