name: CI

permissions:
  contents: read

# The | separator falls back to the module's source repo on any proxy error, not just 404/410.
env:
  GOPROXY: https://proxy.golang.org|direct

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
jobs:
  release-linux-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: namespace-profile-linux-8cpu
            go_arch_name: amd64
          - goarch: arm64
            runner: nscloud-ubuntu-24.04-arm64-4x8
            go_arch_name: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y gcc g++ make git curl tar gzip file binutils libsqlite3-dev

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Go
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 \
            "https://go.dev/dl/go${GO_VERSION}.linux-${{ matrix.go_arch_name }}.tar.gz" -o go.tar.gz
          tar -C /usr/local -xzf go.tar.gz
          rm go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build Linux release binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"
          COMMIT=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          VERSION="ci-$COMMIT"

          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o dist/msgvault-codex-bridge ./cmd/msgvault-codex-bridge
          BRIDGE_SHA256=$(sha256sum dist/msgvault-codex-bridge | cut -d' ' -f1)
          LDFLAGS="-s -w -X go.kenn.io/msgvault/cmd/msgvault/cmd.Version=${VERSION} -X go.kenn.io/msgvault/cmd/msgvault/cmd.Commit=${COMMIT} -X go.kenn.io/msgvault/cmd/msgvault/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X go.kenn.io/msgvault/internal/peoplesweep.codexBridgeSHA256=${BRIDGE_SHA256} -extldflags '-lstdc++ -lm'"
          go build -tags "fts5 sqlite_vec" -trimpath -buildvcs=false -ldflags="$LDFLAGS" -o dist/msgvault ./cmd/msgvault

          echo "--- Binary info ---"
          file dist/msgvault dist/msgvault-codex-bridge
          ldd dist/msgvault || true

          echo "--- Runtime requirements ---"
          objdump -T dist/msgvault 2>/dev/null | grep -oP 'GLIBC_\d+\.\d+' | sort -uV | tail -1 || true
          objdump -T dist/msgvault 2>/dev/null | grep -oP 'GLIBCXX_\d+\.\d+(\.\d+)?' | sort -uV | tail -1 || true

          echo "--- Smoke test ---"
          SMOKE_OUT=$(dist/msgvault version 2>&1)
          echo "$SMOKE_OUT"
          echo "$SMOKE_OUT" | grep -q "$VERSION" || { echo "FATAL: version output doesn't match CI build version"; exit 1; }

  test:
    runs-on: namespace-profile-linux-8cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      - name: Check PostgreSQL build coverage
        run: make pg-shipped-only-check

      - name: Check Huma API contracts
        run: make huma-check

      - name: Install lint tools
        run: |
          make lint-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The three largest packages run in test-sharded below; this covers the
      # rest. Together they are exactly `make test`.
      - name: Test
        run: make test-unsharded

      - name: Test build without vector backends
        run: go test -tags fts5 -run '^TestDocumentVectorStubKeepsStatusAvailableAndBuildActionable$' -count=1 ./cmd/msgvault/cmd

      - name: Check OpenAPI artifacts
        run: make openapi-check

      - name: Lint
        run: make lint-ci

      - name: Vulnerability check
        run: make vulncheck

  # The packages in SHARDED_TEST_PKGS (Makefile) each hold thousands of tests
  # that run one at a time inside one binary, so whole they set the wall clock
  # of the test lane. Each runs here as four concurrent processes of the same
  # binary — scripts/test-package-shards.sh, the Linux twin of the Windows
  # lane's script — on its own runner.
  test-sharded:
    name: test-sharded (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            package: ./cmd/msgvault/cmd
          - name: store
            package: ./internal/store
          - name: api
            package: ./internal/api
    runs-on: namespace-profile-linux-8cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      - name: Test package in isolated shards
        run: scripts/test-package-shards.sh "${{ matrix.package }}" 4 "fts5 sqlite_vec" 60m

  test-macos-15:
    if: github.repository == 'kenn-io/msgvault' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: namespace-profile-mac-6cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      - name: Test
        run: make test

  frontend:
    runs-on: namespace-profile-linux-8cpu
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install container build tools
        # Mirror hiccups have hung plain apt-get for 15+ minutes; bounded
        # timeouts plus retries turn an outage into a short delay.
        run: |
          # The pinned Playwright image already provides Node, while its
          # preconfigured NodeSource repository rejects CI runner traffic.
          # Bun is installed separately below, so only Ubuntu sources are
          # needed for the native build toolchain.
          rm -f /etc/apt/sources.list.d/nodesource.list
          for attempt in 1 2 3; do
            if apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 gcc g++ make unzip libsqlite3-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying" >&2
            sleep 30
          done
          exit 1

      - name: Trust the checkout in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: 'true'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check, test, and build frontend
        run: make web-check web-test web-build

      # The e2e specs generate their archive fixture by running a Go test;
      # compile it here so the first Playwright test doesn't pay the cold
      # cgo build inside its own timeout.
      - name: Precompile e2e archive fixture
        run: go test -tags "fts5 sqlite_vec" -run '^$' -count=1 ./internal/query

      - name: Run deterministic browser and visual tests
        run: make web-test-browser

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-browser-failures
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  web-e2e:
    runs-on: namespace-profile-linux-8cpu
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: 'true'

      - name: Install container build tools
        # Mirror hiccups have hung plain apt-get for 15+ minutes; bounded
        # timeouts plus retries turn an outage into a short delay.
        run: |
          # The pinned Playwright image already provides Node, while its
          # preconfigured NodeSource repository rejects CI runner traffic.
          # Bun is installed separately below, so only Ubuntu sources are
          # needed for the native build toolchain.
          rm -f /etc/apt/sources.list.d/nodesource.list
          for attempt in 1 2 3; do
            if apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 gcc g++ make unzip libsqlite3-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying" >&2
            sleep 30
          done
          exit 1

      - name: Trust the checkout in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # See the frontend job: warm the cgo fixture compile outside test timeouts.
      - name: Precompile e2e archive fixture
        run: go test -tags "fts5 sqlite_vec" -run '^$' -count=1 ./internal/query

      - name: Run accessibility, keyboard, security, and mixed-archive gates
        run: make web-e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-e2e-failures
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  large-archive-benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: namespace-profile-mac-6cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      - name: Run mixed-archive analytical reference benchmark
        run: |
          go test -tags "fts5 sqlite_vec" ./internal/query -run '^$' \
            -bench '^BenchmarkExploreLargeArchive$' -benchtime=3x -count=1 \
            | tee large-archive-benchmark.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: large-archive-benchmark
          path: large-archive-benchmark.txt
          if-no-files-found: error

  test-windows:
    runs-on: namespace-profile-windows-8cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      # sqlite-vec's CGo bindings #include <sqlite3.h>, which isn't on
      # the default include path. Install it from MSYS2 and point
      # CGO_CFLAGS at it. Keep the runner's default compiler for DuckDB.
      #
      # arrow-go/v18's cdata helpers.h declares its helpers as plain
      # `inline` (not `static inline`). Under C99 that requires exactly
      # one external definition somewhere, and no TU in arrow-go
      # provides one. -fgnu89-inline forces every TU to emit the
      # external copy, and --allow-multiple-definition lets MinGW's ld
      # pick the first and continue instead of erroring on the
      # duplicates that flag produces.
      - name: Install SQLite development headers
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: go build -tags "fts5 sqlite_vec" -o msgvault.exe ./cmd/msgvault

      # Run the same custom linter as `make custom-gcl` from PowerShell.
      - name: Lint
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
          GOFLAGS: "-buildvcs=false"
        run: |
          $version = (Select-String -Path .custom-gcl.yml -Pattern '^version: (\S+)').Matches[0].Groups[1].Value
          go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$version" custom --destination "$env:RUNNER_TEMP" --name custom-gcl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/custom-gcl.exe" run ./...

      - name: Test
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: |
          $separatePackages = @(
            "go.kenn.io/msgvault/cmd/msgvault/cmd"
            "go.kenn.io/msgvault/internal/api"
            "go.kenn.io/msgvault/internal/importer"
            "go.kenn.io/msgvault/internal/store"
            "go.kenn.io/msgvault/internal/sync"
            "go.kenn.io/msgvault/internal/vector/embed"
            "go.kenn.io/msgvault/internal/vector/sqlitevec"
            "go.kenn.io/msgvault/scripts"
          )
          $packages = go list -tags "fts5 sqlite_vec" ./... |
            Where-Object { $_ -notin $separatePackages }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -timeout 20m -tags "fts5 sqlite_vec" $packages

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msgvault-windows-amd64
          path: msgvault.exe

  test-windows-slow-packages:
    runs-on: namespace-profile-windows-8cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      - name: Install SQLite development headers
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test slow packages
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: |
          go test -timeout 60m -tags "fts5 sqlite_vec" `
            ./internal/api `
            ./internal/importer `
            ./scripts

  test-windows-sharded:
    name: test-windows-sharded (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # A 4-core runner is already saturated by one package's shards, so the
          # two slowest packages each split across 3 runners.
          - { name: cli-1, package: ./cmd/msgvault/cmd, part: 1, parts: 3, timeout: 60m }
          - { name: cli-2, package: ./cmd/msgvault/cmd, part: 2, parts: 3, timeout: 60m }
          - { name: cli-3, package: ./cmd/msgvault/cmd, part: 3, parts: 3, timeout: 60m }
          - { name: store-1, package: ./internal/store, part: 1, parts: 3, timeout: 60m }
          - { name: store-2, package: ./internal/store, part: 2, parts: 3, timeout: 60m }
          - { name: store-3, package: ./internal/store, part: 3, parts: 3, timeout: 60m }
          - name: sync-vector-embed
            package: ./internal/sync
            package2: ./internal/vector/embed
            timeout: 60m
          - name: vector-sqlite
            package: ./internal/vector/sqlitevec
            timeout: 60m
    runs-on: namespace-profile-windows-8cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      - name: Install SQLite development headers
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test package in isolated shards
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: |
          $packages = @('${{ matrix.package }}', '${{ matrix.package2 }}') |
            Where-Object { $_ }
          foreach ($package in $packages) {
            ./scripts/test-package-shards.ps1 `
              -Package $package `
              -ShardCount 4 `
              -Tags "fts5 sqlite_vec" `
              -Timeout ${{ matrix.timeout }} `
              -PartIndex ${{ matrix.part || 1 }} `
              -PartCount ${{ matrix.parts || 1 }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  test-windows-pack-restore:
    runs-on: namespace-profile-windows-8cpu
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      - name: Install SQLite development headers
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure packed and loose restore layouts
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: |
          go test -tags "fts5 sqlite_vec" ./internal/backupapp `
            -run '^$' -bench '^BenchmarkBackupRestoreLayouts$' -benchtime=1x -count=3 `
            2>&1 | Tee-Object -FilePath pack-restore-benchmark.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: msgvault-windows-pack-restore-benchmark
          path: pack-restore-benchmark.txt
          if-no-files-found: ignore

  # pgvector lane: runs every pgvector-tagged test against a live
  # pgvector/pgvector image — backend, embed queue/worker/enqueue, hybrid
  # filter, scheduler embed-job, and serve/search CLI. The `pgvector` build
  # tag is required; without it these files compile out and ship no tests,
  # so this code would otherwise have zero CI coverage.
  test-pgvector:
    runs-on: namespace-profile-linux-8cpu
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msgvault_test -d msgvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:testpw@localhost:5432/msgvault_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      - name: Enable pgvector extension
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U msgvault_test -d msgvault_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector"

      # -p 4 mirrors PG_TEST_PARALLEL in the Makefile: it caps how many test
      # binaries open connections to the one service container at once. See
      # the Makefile comment for the arithmetic.
      - name: Test (pgvector-tagged)
        run: go test -timeout 60m -p 4 -tags "fts5 sqlite_vec pgvector" -count=1 ./internal/vector/... ./internal/scheduler/... ./cmd/msgvault/cmd/...

  # PostgreSQL backend lane: runs the full Go test suite against a live
  # PostgreSQL service. Tests that use testutil.NewTestStore read
  # MSGVAULT_TEST_DB and switch backends without a recompile. Concurrency
  # tests use -count=5 so non-deterministic races (lost updates, missing
  # unique constraints) surface here rather than slipping past a single
  # pass.
  test-postgres:
    runs-on: namespace-profile-linux-8cpu
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      # This lane uses a stock postgres:16 image (no pgvector extension), so it
      # must NOT build the pgvector tag — those tests CREATE EXTENSION "vector"
      # and fail here. pgvector is covered by the dedicated test-pgvector job
      # against a pgvector/pgvector image. That is why this runs test-pg-shipped
      # (BUILD_TAGS) and not test-pg (PG_TEST_TAGS, which include pgvector).
      #
      # The target carries the same 60m timeout as `make test`:
      # the heavy DuckDB packages can exceed go test's 10m per-package default
      # on a contended runner, and this lane is the slowest one there is.
      # The three largest packages run in test-postgres-sharded below, each
      # against its own server; this covers the rest.
      - name: Test (PostgreSQL)
        run: make test-pg-shipped-unsharded

      - name: Test PostgreSQL library without CGO
        run: make test-pg-nocgo

      - name: Concurrency tests (-count=5)
        run: |
          go test -tags fts5 -count=5 -run 'Concurrent' ./internal/store

  # test-postgres for SHARDED_TEST_PKGS: the same shard script as test-sharded,
  # one package per job, each with its own PostgreSQL service so four shards'
  # connections never compete with the rest of the suite.
  test-postgres-sharded:
    name: test-postgres-sharded (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            package: ./cmd/msgvault/cmd
          - name: store
            package: ./internal/store
          - name: api
            package: ./internal/api
    runs-on: namespace-profile-linux-8cpu
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure Namespace Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: go

      # Shipped build (no pgvector tag) against a stock postgres:16 image, as
      # in test-postgres above.
      - name: Test package in isolated shards (PostgreSQL)
        run: scripts/test-package-shards.sh "${{ matrix.package }}" 4 "fts5 sqlite_vec" 60m
