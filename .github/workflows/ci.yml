name: CI

permissions:
  contents: read

# The | separator falls back to the module's source repo on any proxy error, not just 404/410.
env:
  GOPROXY: https://proxy.golang.org|direct
  GOTRACEBACK: all
  # Compile without absolute source paths, like the Makefile does.
  GOFLAGS: -trimpath

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
jobs:
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      groups: ${{ steps.changes.outputs.groups }}
      all: ${{ steps.changes.outputs.all }}
    steps:
      - uses: kenn-io/actions/changes@e7ba4b0b573de976989328726cdcc83f8a463367
        id: changes
        with:
          filters: |
            go:
              - '!{web/**,docs/**,*.md}'
              - 'docs/assets/**'
              - 'docs/screenshots/**'
              - 'web/src/lib/settings/cron-corpus.json'
              - 'web/tests/e2e/fixtures/operations-public.json'
              - 'web/tests/e2e/fixtures/operations-private-sentinels.json'
            frontend:
              - '!{docs/**,*.md}'

  release-linux-smoke:
    needs: changes
    if: &go-changed ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
            go_arch_name: amd64
            job_timeout: 27
            test_timeout: 5m
          - goarch: arm64
            runner: ubuntu-24.04-arm
            go_arch_name: arm64
            job_timeout: 13
            test_timeout: 5m
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_timeout }}
    container:
      image: ubuntu:26.04
    steps:
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          kit-retry 3 5 apt-get -o APT::Update::Error-Mode=any update
          kit-retry 3 5 apt-get install -y gcc g++ make git curl tar gzip file binutils libsqlite3-dev

      - uses: actions/checkout@v7.0.1

      - name: Install Go
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          # workflowretry: allow Cap each attempt so a slow transfer leaves time to retry.
          kit-retry 6 1 curl -fsSL --connect-timeout 30 --max-time 120 \
            "https://go.dev/dl/go${GO_VERSION}.linux-${{ matrix.go_arch_name }}.tar.gz" -o go.tar.gz
          tar -C /usr/local -xzf go.tar.gz
          rm go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build Linux release binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          # Public PostHog ingest key for anonymous telemetry. Builds without it send no telemetry.
          POSTHOG_PROJECT_KEY: phc_AzHd9YvuHR7M5poKzC6eW654d3SgKyBdoQPuwkWhimUf
          # Package manager that owns the binary. Empty: this binary may replace itself.
          DISTRIBUTION: ''
        run: |
          export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"
          COMMIT=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          VERSION="ci-$COMMIT"

          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o dist/msgvault-codex-bridge ./cmd/msgvault-codex-bridge
          BRIDGE_SHA256=$(sha256sum dist/msgvault-codex-bridge | cut -d' ' -f1)
          LDFLAGS="-s -w -X go.kenn.io/msgvault/cmd/msgvault/cmd.Version=${VERSION} -X go.kenn.io/msgvault/cmd/msgvault/cmd.Commit=${COMMIT} -X go.kenn.io/msgvault/cmd/msgvault/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X go.kenn.io/msgvault/cmd/msgvault/cmd.Distribution=${DISTRIBUTION} -X go.kenn.io/msgvault/internal/peoplesweep.codexBridgeSHA256=${BRIDGE_SHA256} -X go.kenn.io/kit/telemetry/posthog.projectKey=${POSTHOG_PROJECT_KEY} -extldflags '-lstdc++ -lm'"
          go build -tags "fts5 sqlite_vec" -trimpath -buildvcs=false -ldflags="$LDFLAGS" -o dist/msgvault ./cmd/msgvault

          echo "--- Binary info ---"
          file dist/msgvault dist/msgvault-codex-bridge
          ldd dist/msgvault || true

          echo "--- Runtime requirements ---"
          objdump -T dist/msgvault 2>/dev/null | grep -oP 'GLIBC_\d+\.\d+' | sort -uV | tail -1 || true
          objdump -T dist/msgvault 2>/dev/null | grep -oP 'GLIBCXX_\d+\.\d+(\.\d+)?' | sort -uV | tail -1 || true

          echo "--- Smoke test ---"
          SMOKE_OUT=$(dist/msgvault version 2>&1)
          echo "$SMOKE_OUT"
          echo "$SMOKE_OUT" | grep -q "$VERSION" || { echo "FATAL: version output doesn't match CI build version"; exit 1; }

      - name: Test built CLI on a synthetic archive
        run: make test-cli-e2e TEST_TIMEOUT=${{ matrix.test_timeout }} MSGVAULT_E2E_BINARY="$PWD/dist/msgvault"

      - name: Upload test events
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/*-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-cli-e2e-${{ matrix.goarch }}-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

  checks:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    needs: changes
    if: *go-changed
    runs-on: ubuntu-26.04
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: linux-checks
          extra-path: .git/golangci-lint-cache

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install SQLite development headers
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev

      - name: Check PostgreSQL build coverage
        run: make pg-shipped-only-check

      - name: Fetch Go checkers
        run: GOFLAGS="${GOFLAGS:+$GOFLAGS }-n" kit-retry 3 5 make huma-check lint-workflow-retries

      - name: Check Huma API contracts
        run: make huma-check

      - name: Install lint tools
        run: |
          make lint-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check OpenAPI artifacts
        run: make openapi-check

      - name: Lint
        run: |
          cache=$(git rev-parse --git-path golangci-lint-cache)
          cmp -s .custom-gcl.yml "$cache/.custom-gcl.yml" || rm -rf "$cache"
          mkdir -p "$cache"
          cp .custom-gcl.yml "$cache/.custom-gcl.yml"
          make lint-ci

      - name: Vulnerability check
        run: make vulncheck

      - name: Log cache sizes
        if: github.event_name != 'pull_request'
        run: du -sh "$(go env GOCACHE)" "$(go env GOMODCACHE)" "$(git rev-parse --git-path golangci-lint-cache)"

      - name: Save Go caches
        uses: $/.github/actions/go-cache-save

  test:
    needs: changes
    if: *go-changed
    runs-on: ubuntu-26.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: linux-test

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install SQLite development headers
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev

      # Go's test cache keys repo files by mtime.
      # Checkout rewrites them, so derive stable times from file contents.
      - &stable-mtimes
        name: Stabilize tracked file times
        run: go run ./scripts/stable-mtimes

      # test-sharded runs the Makefile's SHARDED_TEST_PKGS; test-unsharded runs the rest of `make test`.
      - name: Test
        run: make test-unsharded TEST_TIMEOUT=17m

      - name: Upload test events
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/unsharded-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-unsharded-attempt-${{ github.run_attempt }}
          path: gotestsum/unsharded.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Test build without vector backends
        run: >-
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/vector-stub.json --rerun-fails=2 --rerun-fails-report gotestsum/vector-stub-reruns.txt
          --packages ./cmd/msgvault/cmd --
          -timeout 5m -tags fts5 -run '^TestDocumentVectorStubKeepsStatusAvailableAndBuildActionable$' -count=1

      - name: Upload test events
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/vector-stub-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-vector-stub-attempt-${{ github.run_attempt }}
          path: gotestsum/vector-stub.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save Go caches
        uses: $/.github/actions/go-cache-save

  # The packages in SHARDED_TEST_PKGS (Makefile) each hold thousands of tests
  # that run one at a time inside one binary, so whole they set the wall clock
  # of the test lane. Each runs here as four concurrent processes of the same
  # binary — scripts/test-package-shards.sh, the Linux twin of the Windows
  # lane's script — on its own runner.
  test-sharded:
    needs: changes
    if: *go-changed
    name: test-sharded (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            package: ./cmd/msgvault/cmd
            job_timeout: 22
            test_timeout: 15m
          - name: store
            package: ./internal/store
            job_timeout: 17
            test_timeout: 10m
          - name: api
            package: ./internal/api
            job_timeout: 13
            test_timeout: 5m
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.job_timeout }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: linux-test

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install test dependencies
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev bubblewrap

      - name: Test package in isolated shards
        run: scripts/test-package-shards.sh "${{ matrix.package }}" 4 "fts5 sqlite_vec" "${{ matrix.test_timeout }}" "sharded-${{ matrix.name }}"

      - name: Upload test events
        if: failure() || github.run_attempt > 1
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-sharded-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

  test-macos-15:
    if: github.repository == 'kenn-io/msgvault' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-26
    timeout-minutes: 79
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: macos

      - name: Test
        run: make test TEST_TIMEOUT=39m

      - name: Upload test events
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/*-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-macos-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save Go caches
        uses: $/.github/actions/go-cache-save

  frontend:
    needs: changes
    if: &web-changed ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'frontend')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: linux-test

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version-file: web/package.json

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install frontend dependencies
        run: DOWNLOAD_RETRY='kit-retry 3 5' make web-install

      - &start-browser-server
        name: Start browser server
        id: browser-server
        timeout-minutes: 10
        working-directory: web
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          image="mcr.microsoft.com/playwright:v$version-noble"
          cli=$(node -p "require.resolve('@playwright/test/cli')")
          kit-retry 3 5 docker pull "$image"
          container_id=$(docker run --detach --interactive --init --network host --ipc host \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --workdir "$GITHUB_WORKSPACE/web" \
            "$image" node "$cli" run-server --host 127.0.0.1 --port 3000)
          echo "container_id=$container_id" >> "$GITHUB_OUTPUT"
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
              echo 'Browser server container exited before becoming ready.' >&2
              exit 1
            fi
            # workflowretry: allow Poll the local service for readiness.
            if curl --fail --silent --output /dev/null --max-time 2 http://127.0.0.1:3000/json; then
              exit 0
            fi
            sleep 1
          done
          echo 'Browser server did not become ready within 30 attempts.' >&2
          exit 1

      - name: Check and test frontend
        run: make web-check web-test

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-unit-attempt-${{ github.run_attempt }}
          path: web/test-results/vitest/unit.json
          retention-days: 14
          if-no-files-found: ignore

      # The e2e specs generate their archive fixture by running a Go test;
      # compile it here so the first Playwright test doesn't pay the cold
      # cgo build inside its own timeout.
      - name: Precompile e2e archive fixture
        run: go test -tags "fts5 sqlite_vec" -run '^$' -count=1 ./internal/query

      - name: Run deterministic browser and visual tests
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
          MSGVAULT_PLAYWRIGHT_SUITE: browser
        run: make web-test-browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-browser-attempt-${{ github.run_attempt }}
          path: web/test-results/playwright/browser.json
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-browser-failures
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - &stop-browser-server
        name: Stop browser server
        if: always() && steps.browser-server.outputs.container_id != ''
        env:
          CONTAINER_ID: ${{ steps.browser-server.outputs.container_id }}
        run: |
          docker logs "$CONTAINER_ID" || true
          docker rm --force "$CONTAINER_ID"

  web-e2e:
    needs: changes
    if: *web-changed
    runs-on: ubuntu-26.04
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: linux-test

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version-file: web/package.json

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install frontend dependencies
        run: DOWNLOAD_RETRY='kit-retry 3 5' make web-install

      - *start-browser-server

      # See the frontend job: warm the cgo fixture compile outside test timeouts.
      - name: Precompile e2e archive fixture
        run: go test -tags "fts5 sqlite_vec" -run '^$' -count=1 ./internal/query

      - name: Run accessibility, keyboard, security, and mixed-archive gates
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
          MSGVAULT_PLAYWRIGHT_SUITE: e2e
        run: make web-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-e2e-attempt-${{ github.run_attempt }}
          path: web/test-results/playwright/e2e.json
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-e2e-failures
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - *stop-browser-server

  large-archive-benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # The sparse benchmark sample is warm; allow for measured macOS query compilation.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: macos

      - name: Run mixed-archive analytical reference benchmark
        run: |
          go test -tags "fts5 sqlite_vec" ./internal/query -run '^$' \
            -bench '^BenchmarkExploreLargeArchive$' -benchtime=3x -count=1 \
            | tee large-archive-benchmark.txt

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: large-archive-benchmark
          path: large-archive-benchmark.txt
          if-no-files-found: error

  test-windows:
    needs: changes
    if: *go-changed
    runs-on: windows-2025
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v7.0.1

      # Reuse these scratch paths in all five Windows jobs.
      - &windows-go-paths
        name: Set cache and scratch paths
        shell: pwsh
        run: |
          $paths = @{ GOCACHE = 'go-build'; GOMODCACHE = 'go-mod'; GOTMPDIR = 'go-tmp'; TEMP = 'test-tmp'; TMP = 'test-tmp'; GOLANGCI_LINT_CACHE = 'golangci-lint' }
          foreach ($entry in $paths.GetEnumerator()) {
            $path = Join-Path $env:RUNNER_TEMP $entry.Value
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            "$($entry.Key)=$path" >> $env:GITHUB_ENV
          }

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: windows

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      # sqlite-vec's CGo bindings #include <sqlite3.h>, which isn't on
      # the default include path. Install it from MSYS2 and point
      # CGO_CFLAGS at it. Keep the runner's default compiler for DuckDB.
      #
      # arrow-go/v18's cdata helpers.h declares its helpers as plain
      # `inline` (not `static inline`). Under C99 that requires exactly
      # one external definition somewhere, and no TU in arrow-go
      # provides one. -fgnu89-inline forces every TU to emit the
      # external copy, and --allow-multiple-definition lets MinGW's ld
      # pick the first and continue instead of erroring on the
      # duplicates that flag produces.
      - name: Install SQLite development headers
        shell: bash
        run: kit-retry 3 5 C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: go build -tags "fts5 sqlite_vec" -o msgvault.exe ./cmd/msgvault

      - *stable-mtimes

      - name: Test
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: |
          $separatePackages = @(
            "go.kenn.io/msgvault/cmd/msgvault/cmd"
            "go.kenn.io/msgvault/internal/api"
            "go.kenn.io/msgvault/internal/importer"
            "go.kenn.io/msgvault/internal/store"
            "go.kenn.io/msgvault/internal/sync"
            "go.kenn.io/msgvault/internal/vector/embed"
            "go.kenn.io/msgvault/internal/vector/sqlitevec"
            "go.kenn.io/msgvault/scripts"
          )
          $packages = go list -tags "fts5 sqlite_vec" ./... |
            Where-Object { $_ -notin $separatePackages }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/windows.json --rerun-fails=2 --rerun-fails-report gotestsum/windows-reruns.txt `
            --packages "$packages" -- -timeout 20m -tags "fts5 sqlite_vec"

      - name: Upload test events
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/*-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-windows-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: msgvault-windows-amd64
          path: msgvault.exe

      - name: Save Go caches
        uses: $/.github/actions/go-cache-save

  lint-windows:
    needs: changes
    if: *go-changed
    runs-on: windows-2025
    timeout-minutes: 64
    steps:
      - uses: actions/checkout@v7.0.1

      - *windows-go-paths

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The Windows test job owns and saves this group; lint only reads it.
      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: windows

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install SQLite development headers
        shell: bash
        run: kit-retry 3 5 C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3

      # Build the same custom linter as `make custom-gcl` from PowerShell.
      # Two runs lost their runner inside this work with no log. GitHub still
      # records when each step starts, so separate steps show whether the
      # runner went silent while building or while linting.
      - name: Build custom linter
        shell: pwsh
        env: &windows-lint-env
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
          GOFLAGS: "-buildvcs=false -trimpath"
        run: |
          $version = (Select-String -Path .custom-gcl.yml -Pattern '^version: (\S+)').Matches[0].Groups[1].Value
          bash -c 'kit-retry 3 5 go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$1" custom --destination "$2" --name custom-gcl' -- "$version" "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint
        shell: pwsh
        env: *windows-lint-env
        # -v logs peak memory and lint time, which shows how close a normal
        # run comes to the runner's 16 GB.
        run: '& "$env:RUNNER_TEMP/custom-gcl.exe" run -v ./...'

  test-windows-slow-packages:
    needs: changes
    if: *go-changed
    runs-on: windows-2025
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v7.0.1

      - *windows-go-paths

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: windows

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install SQLite development headers
        shell: bash
        run: kit-retry 3 5 C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3

      - name: Test slow packages
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: >-
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/windows-slow.json --rerun-fails=2 --rerun-fails-report gotestsum/windows-slow-reruns.txt
          --packages "./internal/api ./internal/importer ./scripts" -- -timeout 9m -tags "fts5 sqlite_vec"

      - name: Upload test events
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/*-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-windows-slow-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

  test-windows-sharded:
    needs: changes
    if: *go-changed
    name: test-windows-sharded (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # A 4-core runner is already saturated by one package's shards, so the
          # two slowest packages each split across 3 runners.
          - { name: cli-1, package: ./cmd/msgvault/cmd, part: 1, parts: 3, timeout: 36m, job_timeout: 45 }
          - { name: cli-2, package: ./cmd/msgvault/cmd, part: 2, parts: 3, timeout: 36m, job_timeout: 45 }
          - { name: cli-3, package: ./cmd/msgvault/cmd, part: 3, parts: 3, timeout: 36m, job_timeout: 64 }
          - { name: store-1, package: ./internal/store, part: 1, parts: 3, timeout: 30m, job_timeout: 38 }
          - { name: store-2, package: ./internal/store, part: 2, parts: 3, timeout: 30m, job_timeout: 38 }
          - { name: store-3, package: ./internal/store, part: 3, parts: 3, timeout: 30m, job_timeout: 58 }
          - name: sync-vector-embed
            job_timeout: 66
            package: ./internal/sync
            package2: ./internal/vector/embed
            timeout: 40m
          - name: vector-sqlite
            job_timeout: 30
            package: ./internal/vector/sqlitevec
            timeout: 9m
    runs-on: windows-2025
    timeout-minutes: ${{ matrix.job_timeout }}
    steps:
      - uses: actions/checkout@v7.0.1

      - *windows-go-paths

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: windows

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install SQLite development headers
        shell: bash
        run: kit-retry 3 5 C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3

      - name: Test package in isolated shards
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: |
          $packages = @('${{ matrix.package }}', '${{ matrix.package2 }}') |
            Where-Object { $_ }
          foreach ($package in $packages) {
            ./scripts/test-package-shards.ps1 `
              -Package $package `
              -ShardCount 4 `
              -Tags "fts5 sqlite_vec" `
              -Timeout ${{ matrix.timeout }} `
              -PartIndex ${{ matrix.part || 1 }} `
              -PartCount ${{ matrix.parts || 1 }} `
              -Suite "windows-sharded-${{ matrix.name }}-$(Split-Path -Leaf $package)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload test events
        if: failure() || github.run_attempt > 1
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-windows-sharded-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

  test-windows-pack-restore:
    if: github.repository == 'kenn-io/msgvault' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - *windows-go-paths

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: windows

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install SQLite development headers
        shell: bash
        run: kit-retry 3 5 C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3

      - name: Measure packed and loose restore layouts
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: |
          go test -tags "fts5 sqlite_vec" ./internal/backupapp `
            -run '^$' -bench '^BenchmarkBackupRestoreLayouts$' -benchtime=1x -count=3 `
            2>&1 | Tee-Object -FilePath pack-restore-benchmark.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: msgvault-windows-pack-restore-benchmark
          path: pack-restore-benchmark.txt
          if-no-files-found: ignore

  # pgvector lane: runs every pgvector-tagged test against a live
  # pgvector/pgvector image — backend, embed queue/worker/enqueue, hybrid
  # filter, scheduler embed-job, and serve/search CLI. The `pgvector` build
  # tag is required; without it these files compile out and ship no tests,
  # so this code would otherwise have zero CI coverage.
  test-pgvector:
    needs: changes
    if: *go-changed
    runs-on: ubuntu-26.04
    timeout-minutes: 109
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256 -c fsync=off -c synchronous_commit=off -c full_page_writes=off"
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=4g
          --health-cmd "pg_isready -U msgvault_test -d msgvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:testpw@localhost:5432/msgvault_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: linux-test

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install test dependencies
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev bubblewrap

      - name: Enable pgvector extension
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U msgvault_test -d msgvault_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector"

      # -p 4 mirrors PG_TEST_PARALLEL in the Makefile: it caps how many test
      # binaries open connections to the one service container at once. See
      # the Makefile comment for the arithmetic.
      - name: Test (pgvector-tagged)
        run: >-
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/pgvector.json --rerun-fails=2 --rerun-fails-report gotestsum/pgvector-reruns.txt
          --packages "./internal/vector/... ./internal/scheduler/..." --
          -timeout 82m -p 4 -tags "fts5 sqlite_vec pgvector" -count=1

      - name: Upload test events
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/pgvector-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-pgvector-attempt-${{ github.run_attempt }}
          path: gotestsum/pgvector.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Test package in isolated shards (pgvector-tagged)
        if: ${{ !cancelled() }}
        run: scripts/test-package-shards.sh ./cmd/msgvault/cmd 4 "fts5 sqlite_vec pgvector" 18m pgvector-cli

      - name: Upload test events
        if: failure() || github.run_attempt > 1
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-pgvector-cli-attempt-${{ github.run_attempt }}
          path: gotestsum/pgvector-cli.json
          retention-days: 14
          if-no-files-found: ignore

  # The shipped-build remainder runs here; test-postgres-sharded covers large packages and follow-up checks.
  # Tests using testutil.NewTestStore read MSGVAULT_TEST_DB and switch backends without recompiling.
  test-postgres:
    needs: changes
    if: *go-changed
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256 -c fsync=off -c synchronous_commit=off -c full_page_writes=off"
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=4g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: linux-postgres

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install SQLite development headers
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev

      - *stable-mtimes

      # This lane uses a stock postgres:16 image (no pgvector extension), so it
      # must NOT build the pgvector tag — those tests CREATE EXTENSION "vector"
      # and fail here. pgvector is covered by the dedicated test-pgvector job
      # against a pgvector/pgvector image. That is why this runs test-pg-shipped
      # (BUILD_TAGS) and not test-pg (PG_TEST_TAGS, which include pgvector).
      #
      # Heavy DuckDB packages can exceed go test's 10m per-package default
      # on a contended runner. Leave time for stack output inside the job cap.
      # The three largest packages run in test-postgres-sharded below, each
      # against its own server; this covers the rest.
      - name: Test (PostgreSQL)
        run: make test-pg-shipped-unsharded TEST_TIMEOUT=24m

      - name: Upload test events
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/*-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-pg-shipped-unsharded-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save Go caches
        uses: $/.github/actions/go-cache-save

  # test-postgres for SHARDED_TEST_PKGS: the same shard script as test-sharded,
  # one package per job, each with its own PostgreSQL service so four shards'
  # connections never compete with the rest of the suite.
  test-postgres-sharded:
    needs: changes
    if: *go-changed
    name: test-postgres-sharded (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            job_timeout: 36
            test_timeout: 18m
            package: ./cmd/msgvault/cmd
          - name: store
            job_timeout: 84
            test_timeout: 71m
            package: ./internal/store
          - name: api
            job_timeout: 30
            test_timeout: 8m
            package: ./internal/api
            followups: true
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.job_timeout }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256 -c fsync=off -c synchronous_commit=off -c full_page_writes=off"
        ports:
          - 5432:5432
        # CI tmpfs peaks: api 427 MiB, pgvector 258 MiB, test-postgres 214 MiB, cli 213 MiB.
        # Store stays on disk: median test time rose from 709s to 792s with tmpfs in five paired CI runs.
        options: >-
          ${{ matrix.name != 'store' && '--tmpfs /var/lib/postgresql:rw,size=4g' || '' }}
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: linux-postgres

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install test dependencies
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev bubblewrap

      # Shipped build (no pgvector tag) against a stock postgres:16 image, as
      # in test-postgres above.
      - name: Test package in isolated shards (PostgreSQL)
        id: postgres-shards
        run: scripts/test-package-shards.sh "${{ matrix.package }}" 4 "fts5 sqlite_vec" "${{ matrix.test_timeout }}" "postgres-sharded-${{ matrix.name }}"

      - name: Upload test events
        if: failure() || github.run_attempt > 1
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-sharded-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: gotestsum/postgres-sharded-${{ matrix.name }}.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Test PostgreSQL library without CGO
        if: ${{ !cancelled() && matrix.followups && steps.postgres-shards.outcome != 'skipped' }}
        run: make test-pg-nocgo TEST_TIMEOUT=5m

      - name: Upload test events
        if: ${{ matrix.followups && (failure() || github.run_attempt > 1 || hashFiles('gotestsum/pg-nocgo-reruns.txt') != '') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-pg-nocgo-attempt-${{ github.run_attempt }}
          path: gotestsum/pg-nocgo.json
          retention-days: 14
          if-no-files-found: ignore

      # Run store concurrency tests after the API package test, away from the store package shard.
      # Five repetitions catch intermittent lost updates and uniqueness races.
      - name: Concurrency tests (-count=5)
        if: ${{ !cancelled() && matrix.followups && steps.postgres-shards.outcome != 'skipped' }}
        run: >-
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/store-concurrency.json --rerun-fails=2 --rerun-fails-report gotestsum/store-concurrency-reruns.txt
          --packages ./internal/store -- -timeout 7m -tags fts5 -count=5 -run 'Concurrent'

      - name: Upload test events
        if: ${{ matrix.followups && (failure() || github.run_attempt > 1 || hashFiles('gotestsum/store-concurrency-reruns.txt') != '') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-store-concurrency-attempt-${{ github.run_attempt }}
          path: gotestsum/store-concurrency.json
          retention-days: 14
          if-no-files-found: ignore
