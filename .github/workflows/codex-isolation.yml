name: Codex isolation

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Compile without absolute source paths, like the Makefile does.
env:
  GOTRACEBACK: all
  GOFLAGS: -trimpath

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  pinned-artifact:
    # Ubuntu 22.04 permits the unprivileged user namespaces used by Bubblewrap.
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: 'true'
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
      - name: Install Bubblewrap
        # CI only needs Ubuntu packages; runner-added repositories can fail independently.
        run: kit-retry 3 5 sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y bubblewrap
      - name: Cache pinned Codex artifact
        id: codex-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/codex-artifact/codex.tar.gz
          key: codex-artifact-3d49d9af25a5168cfc51e50e520ab238b23083c259ae7c14f89b007cb2545c7b
      - name: Download pinned Codex artifact
        if: steps.codex-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/codex-artifact"
          cd "$RUNNER_TEMP/codex-artifact"
          kit-download https://github.com/openai/codex/releases/download/rust-v0.156.0/codex-x86_64-unknown-linux-musl.tar.gz codex.tar.gz
      - name: Verify pinned Codex artifact
        run: |
          cd "$RUNNER_TEMP/codex-artifact"
          echo '3d49d9af25a5168cfc51e50e520ab238b23083c259ae7c14f89b007cb2545c7b  codex.tar.gz' | sha256sum -c -
          tar -xzf codex.tar.gz
          echo '78a11f06e0a2dda42d13fba1d50dc62e8cbdb2d5f69789722f4d4d99b5cdbe30  codex-x86_64-unknown-linux-musl' | sha256sum -c -
          echo "MSGVAULT_CODEX_PINNED_EXECUTABLE=$PWD/codex-x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
      - name: Exercise launcher and protocol without real credentials
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/codex-artifact/msgvault-codex-bridge" ./cmd/msgvault-codex-bridge
          chmod 755 "$RUNNER_TEMP/codex-artifact/msgvault-codex-bridge"
          bridge_digest=$(sha256sum "$RUNNER_TEMP/codex-artifact/msgvault-codex-bridge" | cut -d' ' -f1)
          go test -tags "fts5 sqlite_vec" -c -ldflags="-X go.kenn.io/msgvault/internal/peoplesweep.codexBridgeSHA256=$bridge_digest" -o "$RUNNER_TEMP/codex-artifact/peoplesweep.test" ./internal/peoplesweep
          cd internal/peoplesweep
          MSGVAULT_CODEX_TEST_DEFAULT_BRIDGE=1 "$RUNNER_TEMP/codex-artifact/peoplesweep.test" -test.timeout=5m -test.run='^TestCodex' -test.count=1
