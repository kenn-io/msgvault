name: Documentation

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4

      - name: Install ripgrep
        run: |
          # CI only needs Ubuntu packages; runner-added repositories can fail independently.
          kit-retry 3 5 sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any update
          kit-retry 3 5 sudo apt-get install -y ripgrep

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Install documentation dependencies
        working-directory: docs
        run: kit-retry 3 5 uv sync --frozen --no-dev

      - name: Check documentation
        env:
          DOWNLOAD_RETRY: kit-retry 3 5
        run: make docs-check
