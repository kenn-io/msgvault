# actionlint 1.7.12 predates the GitHub-hosted ubuntu-26.04 runner image.
# Remove this entry once the pinned actionlint release lists ubuntu-26.04.
self-hosted-runner:
  labels:
    - ubuntu-26.04

# actionlint 1.7.12 predates workflow and job cache-mode.
paths:
  .github/workflows/*.yml:
    ignore:
      - 'unexpected key "cache-mode" for "workflow" section'
      - 'unexpected key "cache-mode" for "job" section'
