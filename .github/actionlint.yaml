# actionlint 1.7.12 predates the GitHub-hosted ubuntu-26.04 runner image.
# Remove this entry once the pinned actionlint release lists ubuntu-26.04.
self-hosted-runner:
  labels:
    - ubuntu-26.04

# actionlint 1.7.12 predates cache-mode. Remove these ignores once it supports it.
paths:
  .github/workflows/*-pr.yml:
    ignore:
      - 'unexpected key "cache-mode" for "(job|workflow)" section'
