minimum_prek_version = "0.3.6"
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "go-fmt"
name = "go-fmt"
language = "system"
entry = "make fmt"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "go-lint"
name = "go-lint"
language = "system"
entry = "make lint"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "huma-check"
name = "huma-check"
language = "system"
entry = "make huma-check"
pass_filenames = false
always_run = true
stages = ["pre-push"]
