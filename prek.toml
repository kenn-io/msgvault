minimum_prek_version = "0.3.6"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "go-fmt-lint"
name = "go-fmt-lint"
language = "system"
entry = "make fmt lint"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "huma-check"
name = "huma-check"
language = "system"
entry = "make huma-check"
pass_filenames = false
always_run = true
