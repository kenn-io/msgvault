        display_name:
          type: string
        email:
          type: string
        source_id:
          format: int64
          type: integer
      required:
        - display_name
      type: object
    UpdateResult:
      properties:
        display_name:
          type: string
        email:
          type: string
      required:
        - email
        - display_name
      type: object
    Usage:
      properties:
        available:
          type: boolean
        total_tokens:
          format: int64
          type: integer
      required:
        - total_tokens
        - available
      type: object
    VCardIdentity:
      additionalProperties: false
      properties:
        altid:
          type: string
        group:
          type: string
        pid:
          items:
            type: string
          nullable: true
          type: array
        prop_id:
          type: string
        property:
          type: string
      type: object
    ValueEnvelope:
      properties:
        active_from:
          format: date-time
          type: string
        active_until:
          format: date-time
          type: string
        confidence:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        ordinal:
          format: int64
          type: integer
        pref:
          format: int64
          type: integer
        source:
          type: string
        source_ref:
          type: string
        source_resource_uid:
          type: string
        superseded_at:
          format: date-time
          type: string
        type_label:
          type: string
        type_tokens:
          items:
            type: string
          nullable: true
          type: array
        updated_at:
          format: date-time
          type: string
        vcard:
          $ref: "#/components/schemas/VCardIdentity"
      required:
        - id
        - ordinal
        - vcard
        - source
        - created_at
        - updated_at
      type: object
    ValueEnvelopeInput:
      additionalProperties: false
      properties:
        active_from:
          format: date-time
          type: string
        active_until:
          format: date-time
          type: string
        confidence:
          format: double
          type: number
        ordinal:
          format: int64
          minimum: 0
          type: integer
        pref:
          format: int64
          type: integer
        source:
          type: string
        source_ref:
          type: string
        source_resource_uid:
          type: string
        type_label:
          type: string
        type_tokens:
          items:
            type: string
          nullable: true
          type: array
        vcard:
          $ref: "#/components/schemas/VCardIdentity"
      required:
        - source
      type: object
    VectorHealth:
      properties:
        error:
          type: string
        status:
          type: string
      required:
        - status
      type: object
    VisualBuildRequest:
      additionalProperties: false
      properties:
        consent:
          type: boolean
      required:
        - consent
      type: object
    VisualGeneration:
      properties:
        consent_policy_fingerprint:
          type: string
        consented:
          type: boolean
        dimension:
          format: int64
          type: integer
        fingerprint:
          type: string
        id:
          format: int64
          type: integer
        model:
          type: string
        source_fence:
          format: int64
          type: integer
        state:
          type: string
      required:
        - id
        - fingerprint
        - model
        - dimension
        - state
        - source_fence
        - consented
      type: object
    VisualRetireRequest:
      additionalProperties: false
      properties:
        generation_id:
          format: int64
          type: integer
      required:
        - generation_id
      type: object
    VisualRetryRequest:
      additionalProperties: false
      properties:
        blob_hash:
          type: string
        message_id:
          format: int64
          type: integer
      required:
        - message_id
        - blob_hash
      type: object
    VisualTextSearchRequest:
      additionalProperties: false
      properties:
        after:
          type: string
        before:
          type: string
        cursor:
          type: string
        directions:
          items:
            type: string
          nullable: true
          type: array
        filename:
          type: string
        limit:
          format: int64
          type: integer
        message_id:
          format: int64
          type: integer
        mime_prefix:
          type: string
        participant_id:
          format: int64
          type: integer
        person_id:
          format: int64
          type: integer
        sender_person_id:
          format: int64
          type: integer
        source_id:
          format: int64
          type: integer
        text:
          type: string
      required:
        - text
      type: object
  securitySchemes:
    apiKey:
      in: header
      name: X-Api-Key
      type: apiKey
info:
  title: msgvault API
  version: 2.7.0
openapi: 3.0.3
paths:
  /api/ping:
    get:
      operationId: daemonPing
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingInfo"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      summary: Daemon discovery ping
      tags:
        - Daemon
  /api/session:
    delete:
      operationId: logoutSession
      responses:
        "204":
          description: No Content
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      summary: Delete the current browser session
      tags:
        - Session
    get:
      operationId: getSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      summary: Get browser authentication status
      tags:
        - Session
  /api/session/login:
    post:
      operationId: loginSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      summary: Create an in-memory browser session
      tags:
        - Session
  /api/v1/accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: List scheduler-configured accounts (with sync schedules); use /cli/accounts for all archived sources
      tags:
        - API
    post:
      operationId: addAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAccountRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessageResponse"
          description: OK
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessageResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Add an account
      tags:
        - API
  /api/v1/aggregates:
    get:
      operationId: getAggregates
      parameters:
        - description: Aggregate view type
          in: query
          name: view_type
          schema:
            type: string
        - description: "Sort field: count, size, attachment_size, or name"
          in: query
          name: sort
          schema:
            type: string
        - description: "Sort direction: asc or desc"
          in: query
          name: direction
          schema:
            type: string
        - description: Maximum number of rows to return (default 100; values below 1 fall back to the default)
          in: query
          name: limit
          schema:
            format: int64
            type: integer
        - description: Time bucket granularity
          in: query
          name: time_granularity
          schema:
            type: string
        - description: Source ID
          in: query
          name: source_id
          schema:
            format: int64
            type: integer
        - description: Only include messages with attachments
          in: query
          name: attachments_only
          schema:
            type: boolean
        - description: Exclude deleted messages
          in: query
          name: hide_deleted
          schema:
            type: boolean
        - description: Search query
          in: query
          name: search_query
          schema:
            type: string
        - description: Lower date/time bound (RFC3339 or YYYY-MM-DD)
          in: query
          name: after
          schema:
            type: string
        - description: Upper date/time bound (RFC3339 or YYYY-MM-DD)
          in: query
          name: before
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Get aggregate rows
      tags:
        - API
  /api/v1/aggregates/sub:
    get:
      operationId: getSubAggregates
      parameters:
        - description: Aggregate view type
          in: query
          name: view_type
          required: true
          schema:
            type: string
        - description: "Sort field: count, size, attachment_size, or name"
          in: query
          name: sort
          schema:
            type: string
        - description: "Sort direction: asc or desc"
          in: query
          name: direction
          schema:
            type: string
        - description: Maximum number of rows to return (default 100; values below 1 fall back to the default)
          in: query
          name: limit
          schema:
            format: int64
            type: integer
        - description: Time bucket granularity
          in: query
          name: time_granularity
          schema:
            type: string
        - description: Source ID
          in: query
          name: source_id
          schema:
            format: int64
            type: integer
        - description: Only include messages with attachments
          in: query
          name: attachments_only
          schema:
            type: boolean
        - description: Exclude deleted messages
          in: query
          name: hide_deleted
          schema:
            type: boolean
        - description: Search query
          in: query
          name: search_query
          schema:
            type: string
        - description: Lower date/time bound (RFC3339 or YYYY-MM-DD)
          in: query
          name: after
          schema:
            type: string
        - description: Upper date/time bound (RFC3339 or YYYY-MM-DD)
          in: query
          name: before
          schema:
            type: string
        - description: Sender email/address filter
          in: query
          name: sender
          schema:
            type: string
        - description: Sender display-name filter
          in: query
          name: sender_name
          schema:
            type: string
        - description: Recipient email/address filter
          in: query
          name: recipient
          schema:
            type: string
        - description: Recipient display-name filter
          in: query
          name: recipient_name
          schema:
            type: string
        - description: Domain filter
          in: query
          name: domain
          schema:
            type: string
        - description: Label filter
          in: query
          name: label
          schema:
            type: string
        - description: Message type filter
          in: query
          name: message_type
          schema:
            type: string
        - description: Named time period
          in: query
          name: time_period
          schema:
            type: string
        - description: Conversation ID
          in: query
          name: conversation_id
          schema:
            format: int64
            type: integer
        - description: Comma-separated aggregate view names to match empty values
          in: query
          name: empty_targets
          schema:
            type: string
        - description: Zero-based row offset
          in: query
          name: offset
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Get nested aggregate rows
      tags:
        - API
  /api/v1/attachments/{hash}/content:
    get:
      operationId: getAttachmentContent
      parameters:
        - description: Attachment SHA-256 content hash
          in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            "*/*":
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Download attachment content by SHA-256 hash
      tags:
        - API
  /api/v1/attachments/{id}:
    get:
      operationId: getAttachment
      parameters:
        - description: Attachment ID
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentInfo"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Get attachment metadata
      tags:
        - API
  /api/v1/attribute-definitions:
    get:
      operationId: listAttributeDefinitions
      parameters:
        - description: Filter by object type
          in: query
          name: object_type
          schema:
            type: string
        - description: Include deactivated definitions
          in: query
          name: include_hidden
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionsResponse"
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: List portable attribute definitions
      tags:
        - API
    post:
      operationId: createAttributeDefinition
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributeDefinitionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinition"
          description: Created
          headers:
            ETag:
              description: Strong attribute definition revision tag
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Create a user attribute definition
      tags:
        - API
  /api/v1/attribute-definitions/{id}:
    delete:
      operationId: deleteAttributeDefinition
      parameters:
        - description: Attribute definition ID
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: Strong ETag returned by the latest definition read
          in: header
          name: If-Match
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Delete a user attribute definition
      tags:
        - API
    get:
      operationId: getAttributeDefinition
      parameters:
        - description: Attribute definition ID
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinition"
          description: OK
          headers:
            ETag:
              description: Strong attribute definition revision tag
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Get one attribute definition
      tags:
        - API
    patch:
      operationId: patchAttributeDefinition
      parameters:
        - description: Attribute definition ID
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: Strong ETag returned by the latest definition read
          in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAttributeDefinitionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinition"
          description: OK
          headers:
            ETag:
              description: Strong attribute definition revision tag
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Update mutable attribute definition fields
      tags:
        - API
  /api/v1/auth/token/{email}:
    post:
      operationId: uploadToken
      parameters:
        - description: Account email address
          in: path
          name: email
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenUploadRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessageResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Upload an OAuth token
      tags:
        - API
  /api/v1/backup/freeze/begin:
    post:
      operationId: beginBackupFreeze
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupFreezeBeginResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Begin a backup freeze window
      tags:
        - API
  /api/v1/backup/freeze/end:
    post:
      operationId: endBackupFreeze
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupFreezeEndRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupFreezeEndResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: End a backup freeze window
      tags:
        - API
  /api/v1/cli/account:
    post:
      operationId: updateCLIAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHTTPError"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHTTPError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHTTPError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHTTPError"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHTTPError"
          description: Service Unavailable
      security:
        - apiKey: []
      summary: Update an account for CLI use
      tags:
        - CLI
  /api/v1/cli/accounts:
    get:
      operationId: listCLIAccounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliAccountsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: List accounts for CLI output
      tags:
        - API
  /api/v1/cli/add-calendar/plan:
    post:
      operationId: planCLIAddCalendar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CLIAddCalendarPlanRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CLIAddCalendarPlanResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Plan CLI Calendar account setup
      tags:
