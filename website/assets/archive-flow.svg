<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Your history, connected</title>
  <desc id="desc">People and communications flow into one msgvault archive on your own hardware. Use the same archive through the terminal, web browser, or an AI assistant via MCP.</desc>

  <!-- All sources converge on one archive; each interface reads that archive. -->
  <g fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 102h22q14 0 14 14v50q0 14 14 14h18"/>
    <path d="M128 252h22q14 0 14-14v-44q0-14 14-14"/>
    <path d="m189 175 7 5-7 5"/>
    <path d="M348 180h23q14 0 14-14V88q0-14 14-14h15"/>
    <path d="M348 180h66"/>
    <path d="M371 180q14 0 14 14v78q0 14 14 14h15"/>
    <path d="m407 69 7 5-7 5m0 96 7 5-7 5m0 96 7 5-7 5"/>
  </g>

  <!-- People and the communications they leave behind. -->
  <g fill="none" stroke="#c8c8c8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="62" cy="82" r="10"/>
    <path d="M43 114v-7c0-9 8-15 19-15s19 6 19 15v7M82 74a9 9 0 0 1 0 18m7 4c7 2 11 7 11 14v4"/>
    <rect x="39" y="224" width="37" height="27" rx="3"/>
    <path d="m40 226 17.5 13 17.5-13"/>
    <path d="M69 215v-10a3 3 0 0 1 3-3h27a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3H87l-8 7v-7"/>
    <path d="M78 212h15m-15 7h10" stroke="#888"/>
  </g>

  <!-- The archive is the only filled shape. -->
  <rect x="198" y="128" width="150" height="104" rx="8" fill="#131313" stroke="#666"/>
  <path d="M217 128h-11a8 8 0 0 0-8 8v11m131 85h11a8 8 0 0 0 8-8v-11" fill="none" stroke="#e8e8e8" stroke-width="1.5"/>

  <!-- Terminal, browser, and an agent connection. -->
  <g fill="none" stroke="#c8c8c8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="429" y="59" width="34" height="28" rx="3"/>
    <path d="m436 67 5 5-5 5m9 0h9"/>
    <rect x="429" y="166" width="34" height="28" rx="3"/>
    <path d="M429 174h34m-27-4h1m4 0h1m-6 10h9m-9 6h18"/>
    <path d="m440 282 10-10m-10 18 10 10"/>
    <circle cx="436" cy="286" r="6"/>
    <circle cx="454" cy="268" r="5"/>
    <circle cx="454" cy="304" r="5"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#e8e8e8">
    <text x="70" y="143" text-anchor="middle" font-size="19">People</text>
    <text x="70" y="280" text-anchor="middle" font-size="17">Communications</text>
    <text x="273" y="175" text-anchor="middle" font-family="ui-monospace, monospace" font-size="23" letter-spacing="-1">msgvault</text>
    <text x="273" y="203" text-anchor="middle" font-size="16" fill="#aaa">your archive</text>
    <text x="273" y="258" text-anchor="middle" font-size="14" fill="#aaa">on your hardware</text>
    <g font-family="ui-monospace, monospace" font-size="20">
      <text x="478" y="80">TUI</text>
      <text x="478" y="187">Web</text>
      <text x="478" y="293">MCP</text>
    </g>
  </g>
</svg>
