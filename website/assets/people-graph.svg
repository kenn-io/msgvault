    <rect x="66" y="144" width="216" height="56" rx="6"/>
    <rect x="42" y="232" width="216" height="56" rx="6"/>
    <rect x="66" y="320" width="216" height="56" rx="6"/>
    <rect x="42" y="408" width="216" height="56" rx="6"/>
  </g>
  <rect x="452" y="170" width="266" height="180" rx="8" fill="#1b1b1b" stroke="#e8e8e8" stroke-width="1.5"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <g fill="#f2f2f2" font-size="14">
      <text x="60" y="84">alice@example.com</text>
      <text x="84" y="172">alice.w@example.org</text>
      <text x="60" y="260">@alice · slack</text>
      <text x="84" y="348">+1 555 0134 · sms</text>
      <text x="60" y="436">alice#4021 · discord</text>
    </g>
    <g fill="#a3a3a3" font-size="11">
      <text x="60" y="102">gmail</text>
      <text x="84" y="190">imap</text>
      <text x="60" y="278">workspace</text>
      <text x="84" y="366">phone backup</text>
      <text x="60" y="454">guild</text>
