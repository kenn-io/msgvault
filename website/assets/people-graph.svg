    <text x="472" y="204" fill="#e8e8e8" font-size="13" letter-spacing="3">PERSON</text>
    <text x="472" y="238" fill="#f2f2f2" font-size="22">Alice Warren</text>
    <text x="472" y="268" fill="#a3a3a3" font-size="13">5 identities · 4 sources</text>
    <text x="472" y="292" fill="#a3a3a3" font-size="13">first contact 2009</text>
    <text x="472" y="316" fill="#a3a3a3" font-size="13">12,408 messages</text>
