<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">msgvault people layer</title>
  <desc id="desc">Addresses, handles, and phone numbers from different sources resolve to one durable person profile.</desc>
  <defs>
    <pattern id="grid-people" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1c1c1c"/>
    </pattern>
  </defs>
  <rect width="760" height="520" fill="#0a0a0a"/>
  <rect width="760" height="520" fill="url(#grid-people)"/>
  <g fill="none" stroke="#3a3a3a" stroke-width="2">
    <path d="M258 84q120 8 190 132"/>
    <path d="M282 172q90 6 160 56"/>
    <path d="M258 260h180"/>
    <path d="M282 348q90 -6 160 -56"/>
    <path d="M258 436q120 -8 190 -132"/>
  </g>
  <g fill="#e8e8e8" stroke="#0a0a0a" stroke-width="2">
    <circle cx="448" cy="216" r="4.5"/>
    <circle cx="442" cy="228" r="4.5"/>
    <circle cx="438" cy="260" r="4.5"/>
    <circle cx="442" cy="292" r="4.5"/>
    <circle cx="448" cy="304" r="4.5"/>
  </g>
  <g fill="#131313" stroke="#282828" stroke-width="1.5">
