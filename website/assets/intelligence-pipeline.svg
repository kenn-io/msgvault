<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">msgvault intelligence pipeline</title>
  <desc id="desc">The archive feeds a keyword index, vector embeddings, and Docbank document text; hybrid retrieval fuses them for the CLI, Web UI, and MCP agents.</desc>
  <defs>
    <pattern id="grid-intel" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1c1c1c"/>
    </pattern>
  </defs>
  <rect width="760" height="440" fill="#0a0a0a"/>
  <rect width="760" height="440" fill="url(#grid-intel)"/>
  <g fill="none" stroke="#3a3a3a" stroke-width="2">
    <path d="M212 186q28 -60 66 -74"/>
    <path d="M216 220h60"/>
    <path d="M212 254q28 60 66 74"/>
    <path d="M482 112q38 14 66 74"/>
    <path d="M484 220h60"/>
    <path d="M482 328q38 -14 66 -74"/>
  </g>
  <g fill="none" stroke="#e8e8e8" stroke-width="2">
    <path d="M648 186v-60"/>
    <path d="M648 254v60"/>
  </g>
  <g fill="#e8e8e8" stroke="#0a0a0a" stroke-width="2">
