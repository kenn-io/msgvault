          type: string
      required:
        - kind
        - key
        - revision
      type: object
    TaskIntegrationStatusResponse:
      additionalProperties: true
      properties:
        message:
          description: Credential-free status explanation
          type: string
        project:
          description: Configured project when available
          type: string
        security_note:
          description: Platform-specific local socket security limitation
          type: string
        state:
          description: Current task integration state
          enum:
            - disabled
            - not_found
            - authentication_required
            - unreachable
            - incompatible
            - wrong_project
            - ready
          type: string
      required:
        - state
        - message
      type: object
    TaskLinkLookupResponse:
      additionalProperties: true
      properties:
        complete:
          type: boolean
        last_scan:
          format: date-time
          type: string
        outbound_metadata:
          $ref: "#/components/schemas/TaskLinkOutboundMetadata"
        reason:
          type: string
        remote_revision:
          type: string
        state:
          type: string
        tasks:
          items:
            $ref: "#/components/schemas/TaskSummary"
          type: array
      required:
        - tasks
        - outbound_metadata
        - state
        - complete
        - last_scan
      type: object
    TaskLinkMutationRequest:
      additionalProperties: false
      properties:
        added_at:
          description: Browser-generated retry-stable RFC3339 timestamp for the outbound mail link
          type: string
        description:
          type: string
        labels:
          items:
            type: string
          type: array
        priority:
          type: string
        task_id:
          description: Existing task to link; omit to create a task
          type: string
        title:
          type: string
      required:
        - added_at
      type: object
    TaskLinkMutationResponse:
      additionalProperties: true
      properties:
        task:
          $ref: "#/components/schemas/TaskLinkTask"
      required:
        - task
      type: object
    TaskLinkOutboundMetadata:
      additionalProperties: true
      properties:
        archive_uid:
          type: string
        conversation_id:
          format: int64
          type: integer
        from:
          type: string
        message_id:
          format: int64
          type: integer
        sent_at:
          type: string
        source_identifier:
          type: string
        source_message_id:
          type: string
        source_type:
          type: string
        subject:
          type: string
      required:
        - archive_uid
        - message_id
        - conversation_id
        - subject
        - from
        - sent_at
        - source_type
        - source_identifier
        - source_message_id
      type: object
    TaskLinkTask:
      additionalProperties: true
      properties:
        id:
          type: string
        project:
          type: string
        revision:
          type: string
        title:
          type: string
      required:
        - id
        - project
        - title
      type: object
    TaskSearchResponse:
      additionalProperties: true
      properties:
        tasks:
          items:
            $ref: "#/components/schemas/TaskSummary"
          type: array
      required:
        - tasks
      type: object
    TaskSummary:
      additionalProperties: true
      properties:
        id:
          type: string
        revision:
          type: string
        title:
          type: string
      required:
        - id
        - title
      type: object
    TemperatureSignals:
      additionalProperties: true
      properties:
        meeting_signal:
          format: double
          type: number
        modalities:
          format: int64
          type: integer
        received_volume:
          format: double
          type: number
        sent_signal:
          format: double
          type: number
      required:
        - sent_signal
        - received_volume
        - meeting_signal
        - modalities
      type: object
    TemperatureSummary:
      additionalProperties: true
      properties:
        population:
          format: int64
          type: integer
        rank:
          format: int64
          type: integer
        raw_score:
          format: double
          type: number
        signals:
          $ref: "#/components/schemas/TemperatureSignals"
        temperature:
          format: int64
          type: integer
      required:
        - temperature
        - rank
        - population
        - raw_score
        - signals
      type: object
    TextConversationRow:
      additionalProperties: true
      properties:
        conversation_id:
          format: int64
          type: integer
        last_message_at:
          type: string
        last_preview:
          type: string
        message_count:
          format: int64
          type: integer
        participant_count:
          format: int64
          type: integer
        source_type:
          type: string
        title:
          type: string
      required:
        - conversation_id
        - title
        - source_type
        - message_count
        - participant_count
        - last_preview
      type: object
    TextConversationsResponse:
      additionalProperties: true
      properties:
        cache_revision:
          type: string
        conversations:
          items:
            $ref: "#/components/schemas/TextConversationRow"
          type: array
        count:
          format: int64
          type: integer
        has_more:
          type: boolean
        limit:
          format: int64
          type: integer
        offset:
          format: int64
          type: integer
      required:
        - cache_revision
        - count
        - has_more
        - offset
        - limit
        - conversations
      type: object
    TextMessagesResponse:
      additionalProperties: true
      properties:
        cache_revision:
          type: string
        count:
          format: int64
          type: integer
        has_more:
          type: boolean
        limit:
          format: int64
          type: integer
        messages:
          items:
            $ref: "#/components/schemas/CLIQueryMessageSummary"
          type: array
        offset:
          format: int64
          type: integer
      required:
        - cache_revision
        - count
        - has_more
        - offset
        - limit
        - messages
      type: object
    TextSearchResponse:
      additionalProperties: true
      properties:
        count:
          format: int64
          type: integer
        has_more:
          type: boolean
        limit:
          format: int64
          type: integer
        messages:
          items:
            $ref: "#/components/schemas/CLIQueryMessageSummary"
          type: array
        offset:
          format: int64
          type: integer
      required:
        - count
        - has_more
        - offset
        - limit
        - messages
      type: object
    TimelineRow:
      additionalProperties: true
      properties:
        anchor_message_id:
          format: int64
          type: integer
        conversation_id:
          format: int64
          type: integer
        first_at:
          format: date-time
          type: string
        has_attachments:
          type: boolean
        key:
          type: string
        kind:
          type: string
        message_count:
          format: int64
          type: integer
        occurred_at:
          format: date-time
          type: string
        preview:
          type: string
        source_id:
          format: int64
          type: integer
        title:
          type: string
      required:
        - key
        - kind
        - title
        - preview
        - occurred_at
        - message_count
        - source_id
        - has_attachments
      type: object
    TokenUploadRequest:
      additionalProperties: false
      properties:
        access_token:
          type: string
        client_id:
          type: string
        expiry:
          format: date-time
          type: string
        refresh_token:
          type: string
        scopes:
          items:
            type: string
          type: array
        tenant_id:
          type: string
        token_type:
          type: string
      required:
        - refresh_token
      type: object
    TotalStatsResponse:
      additionalProperties: true
      properties:
        account_count:
          format: int64
          type: integer
        active_messages:
          format: int64
          type: integer
        applied_search_scope:
          type: boolean
        applied_source_ids:
          items:
            format: int64
            type: integer
          type: array
        attachment_count:
          format: int64
          type: integer
        attachment_size:
          format: int64
          type: integer
        label_count:
          format: int64
          type: integer
        message_count:
          format: int64
          type: integer
        source_deleted_messages:
          format: int64
          type: integer
        total_size:
          format: int64
          type: integer
      required:
        - message_count
        - active_messages
        - source_deleted_messages
        - total_size
        - attachment_count
        - attachment_size
        - label_count
        - account_count
      type: object
    TranscriptSegment:
      additionalProperties: false
      properties:
        offset_seconds:
          format: double
          minimum: 0
          type: number
        speaker:
          type: string
        text:
          type: string
      required:
        - speaker
        - text
      type: object
    UpdateRequest:
      additionalProperties: false
      properties:
        account:
          type: string
        display_name:
          type: string
        email:
          type: string
        source_id:
          format: int64
          type: integer
      required:
        - display_name
      type: object
    UpdateResult:
      additionalProperties: true
      properties:
        display_name:
          type: string
        email:
          type: string
      required:
        - email
        - display_name
      type: object
    Usage:
      additionalProperties: true
      properties:
        available:
          type: boolean
        total_tokens:
          format: int64
          type: integer
      required:
        - total_tokens
        - available
      type: object
    VCardIdentity:
      additionalProperties: false
      properties:
        altid:
          type: string
        group:
          type: string
        pid:
          items:
            type: string
          type: array
        prop_id:
          type: string
        property:
          type: string
      type: object
    ValueEnvelope:
      additionalProperties: true
      properties:
        active_from:
          format: date-time
          type: string
        active_until:
          format: date-time
          type: string
        confidence:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        ordinal:
          format: int64
          type: integer
        pref:
          format: int64
          type: integer
        source:
          type: string
        source_ref:
          type: string
        source_resource_uid:
          type: string
        superseded_at:
          format: date-time
          type: string
        type_label:
          type: string
        type_tokens:
          items:
            type: string
          type: array
        updated_at:
          format: date-time
          type: string
        vcard:
          $ref: "#/components/schemas/VCardIdentity"
      required:
        - id
        - ordinal
        - vcard
        - source
        - created_at
        - updated_at
      type: object
    ValueEnvelopeInput:
      additionalProperties: false
      properties:
        active_from:
          format: date-time
          type: string
        active_until:
          format: date-time
          type: string
        confidence:
          format: double
          type: number
        ordinal:
          format: int64
          minimum: 0
          type: integer
        pref:
          format: int64
          type: integer
        source:
          type: string
        source_ref:
          type: string
        source_resource_uid:
          type: string
        type_label:
          type: string
        type_tokens:
          items:
            type: string
          type: array
        vcard:
          $ref: "#/components/schemas/VCardIdentity"
      required:
        - source
      type: object
    VectorHealth:
      additionalProperties: true
      properties:
        error:
          type: string
        status:
          type: string
      required:
        - status
      type: object
    VisualBuildRequest:
      additionalProperties: false
      properties:
        consent:
          type: boolean
      required:
        - consent
      type: object
    VisualGeneration:
      additionalProperties: true
      properties:
        consent_policy_fingerprint:
          type: string
        consented:
          type: boolean
        dimension:
          format: int64
          type: integer
        fingerprint:
          type: string
        id:
          format: int64
          type: integer
        model:
          type: string
        source_fence:
          format: int64
          type: integer
        state:
          type: string
      required:
        - id
        - fingerprint
        - model
        - dimension
        - state
        - source_fence
        - consented
      type: object
    VisualRetireRequest:
      additionalProperties: false
      properties:
        generation_id:
          format: int64
          type: integer
