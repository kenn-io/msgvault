  /api/v1/search:
    get:
      operationId: searchMessages
      parameters:
        - description: Search query
          in: query
          name: q
          required: true
          schema:
            type: string
        - description: "Search mode: fts, vector, or hybrid. conversation_id applies in every mode; other structured filter parameters require vector or hybrid"
          in: query
          name: mode
          schema:
            type: string
        - description: One-based page number (default 1; values below 1 are clamped to 1). Non-numeric values are rejected with 400.
          in: query
          name: page
          schema:
            format: int64
            type: integer
        - description: Page size (default 20, max 100; out-of-range values are clamped). Non-numeric values are rejected with 400.
          in: query
          name: page_size
          schema:
            format: int64
            type: integer
        - description: Zero-based ranking offset for vector or hybrid search (default 0)
          in: query
          name: offset
          schema:
            format: int64
            type: integer
        - description: Include score explanation when mode is vector or hybrid
          in: query
          name: explain
          schema:
            type: boolean
        - description: Include scored semantic chunk excerpts for vector or hybrid results
          in: query
          name: include_matches
          schema:
            type: boolean
        - description: Minimum chunk score for included excerpts; does not filter ranked messages
          in: query
          name: min_score
          schema:
            type: number
        - description: Message type filter; repeat or comma-separate for multiple values
          in: query
          name: message_type
          schema:
            type: string
        - description: Restrict to one account/source
          in: query
          name: account
          schema:
            type: string
        - description: Restrict to one collection
          in: query
          name: collection
          schema:
            type: string
        - description: Exact conversation ID (all search modes)
          in: query
          name: conversation_id
          schema:
            format: int64
            type: integer
        - description: Exact sender email/address filter (vector or hybrid mode only)
          in: query
          name: sender
          schema:
            type: string
        - description: Exact recipient email filter across to, cc, and bcc (vector or hybrid mode only)
          in: query
          name: recipient
          schema:
            type: string
        - description: Exact sender domain filter (vector or hybrid mode only)
          in: query
          name: domain
          schema:
            type: string
        - description: Exact case-insensitive label filter (vector or hybrid mode only)
          in: query
          name: label
          schema:
            type: string
        - description: Exact case-insensitive RFC 2919 List-Id filter (vector or hybrid mode only)
          in: query
          name: list_id
          schema:
            type: string
        - description: Calendar period in YYYY, YYYY-MM, or YYYY-MM-DD format (vector or hybrid mode only)
          in: query
          name: time_period
          schema:
            type: string
        - description: Time bucket granularity (vector or hybrid mode only)
          in: query
          name: time_granularity
          schema:
            type: string
        - description: Exact source ID (vector or hybrid mode only)
          in: query
          name: source_id
          schema:
            format: int64
            type: integer
        - description: Only include messages with attachments (vector or hybrid mode only)
          in: query
          name: attachments_only
          schema:
            type: boolean
        - description: Lower date/time bound (RFC3339 or YYYY-MM-DD; vector or hybrid mode only)
          in: query
          name: after
          schema:
            type: string
        - description: Upper date/time bound (RFC3339 or YYYY-MM-DD; vector or hybrid mode only)
          in: query
          name: before
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SearchResult"
                  - $ref: "#/components/schemas/HybridSearchResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Search messages
      tags:
        - API
  /api/v1/search/attachments/visual:
    post:
      operationId: searchVisualAttachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualTextSearchRequest"
          multipart/form-data:
            schema:
              properties:
                after:
                  type: string
                before:
                  type: string
                cursor:
                  type: string
                direction:
                  items:
                    enum:
                      - from_person
                      - to_person
                      - group
                    type: string
                  type: array
                filename:
                  type: string
                image:
                  contentMediaType: application/octet-stream
                  description: Query image (JPEG, PNG, WebP, or still GIF)
                  format: binary
                  type: string
                limit:
                  type: string
                message_id:
                  type: string
                mime_prefix:
                  type: string
                participant_id:
                  type: string
                person_id:
                  type: string
                sender_person_id:
                  type: string
                source_id:
                  type: string
              required:
                - image
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error
      security:
        - apiKey: []
      summary: Search visual attachment content
      tags:
        - Exploration
