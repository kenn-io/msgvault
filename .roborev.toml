display_name = "msgvault"

review_guidelines = """
We are using the latest production version of Go.
Please be pragmatic about reviews, raising theoretical or highly
pedantic concerns will result in unnecessary code churn and wasted
review-fix cycles.

CI already builds and tests this project. Do not assert that code fails
to compile, tests fail, symbols are undefined, APIs do not exist, or
similar build-verifiable facts unless you personally ran the relevant
command during this review and can cite the exact failing command and
output. Inferred compile or test failures are not findings. If the concern
is only based on reasoning from the diff, describe the underlying behavior
risk instead of claiming the build is broken.

The Windows CSV fallback path uses \\N as a NULL sentinel (PostgreSQL
convention) with DuckDB's nullstr option. This is an accepted design
choice — do not flag it as a concern.

HTTP remote defaults, plaintext key display in interactive CLI,
enabled=true override on account creation, and page-aligned pagination
are documented design decisions — see code comments at each site.

TimeGranularity defaults to "month" when unspecified, which is correct.

This is a single-user personal tool with no setuid, no shared
directories, and no multi-tenant access. Do not flag
symlink-following, local file overwrites, or similar CWE patterns that
require an attacker with the same privileges as the user — they already
own everything this tool touches. Auth on loopback-only endpoints with
no configured API key is also by design.

Owner credentials (the server API key, a browser session, or keyless
loopback access when no key is configured) are privileged. Do not
flag SQL injection, statement validation, DDL bypass, or multi-statement
risks on the query interface — the user is trusted and can already do
anything via direct database access. The query surface is a convenience
layer, not a security boundary.

Delegated agent tokens (`X-Msgvault-Agent-Token`, enabled by
`[server] agent_access`) and read-only remote client keys
(`[[server.remote_clients]]`) are restricted credentials, and their
limits are a real boundary. The daemon checks each agent call against the
grant's permissions and exact source scope. A message, thread, or
attachment outside the grant returns the same 404 as a missing one.
Routes without a delegated permission, including SQL, exports,
configuration, and grant management, stay owner-only. Remote client keys
reach only a fixed set of read operations. Flag changes that let either
credential exceed its grant, reach an owner-only route, or reveal whether
an out-of-scope record exists. See docs/api-server.md and the agent
commands in docs/cli-reference.md.

IMAP passwords are stored on disk with restricted file permissions
(0600), equivalent to OAuth tokens and API keys in the same data
directory. If the data directory is compromised, the user must rotate
their IMAP app-specific password just as they would revoke API keys.
Do not flag plaintext IMAP password storage as a finding.

The public documentation build is a different trust boundary from the
single-user local application. `docs/site`, Vercel output, and docs asset
branches are unauthenticated public artifacts. Flag paths that can publish
repo-ignored local credential files, dotenv files, OAuth client JSON, or
other dotfiles into those artifacts. Do not flag literal example strings in
documentation snippets as leaked secrets unless they are plausible real
credentials.

The Jev adapter passes a plain http.Client to Docbank's TypeSafe client,
which refuses redirects on its own copy. Do not flag redirect handling
in internal/vector/rerank/jev.go.

The hidden-text flag (internal/mime/hidden_html.go) is a best-effort
heuristic, not a security boundary. It reads only inline styles and
legacy attributes, so a <style> block already bypasses it. Do not flag
CSS cascade, value-validation, or color edge cases where inline CSS sets
or clears the flag differently from a browser.
"""
