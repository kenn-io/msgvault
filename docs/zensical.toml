[project]
site_name = "msgvault"
site_url = "https://msgvault.io/docs/"
site_description = "A local-first archive for communications and relationships: setup, sources, people, search, operations, and integration reference."
site_author = "Kenn Software LLC"
copyright = 'Copyright &copy; 2026 <a href="https://kenn.io">Kenn Software LLC</a>. MIT License.'
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/kenn-io/msgvault"
repo_name = "kenn-io/msgvault"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/lightbox.js"]
use_directory_urls = true
nav = [
  {"Start Here" = [
    {"Documentation" = "index.md"},
    {"Setup" = "setup.md"},
    {"Choose a Source" = "guides/sources.md"},
  ]},
  {"Explore Your Archive" = [
    {"Web UI" = "web-ui.md"},
    {"Terminal UI" = "usage/tui.md"},
    {"Searching" = "usage/searching.md"},
    {"Semantic and Visual Search" = "usage/vector-search.md"},
    {"Document Attachment Indexing" = "usage/document-indexing.md"},
    {"Recommended Configuration" = "usage/recommended-configuration.md"},
    {"Analytics and Stats" = "usage/analytics.md"},
    {"SQL Queries" = "usage/querying.md"},
    {"Exporting" = "usage/exporting.md"},
  ]},
  {"Sync and Import" = [
    {"OAuth Setup" = "guides/oauth-setup.md"},
    {"IMAP Mail" = "usage/imap.md"},
    {"Local Email" = "usage/importing.md"},
    {"Remote Email Images" = "usage/remote-images.md"},
    {"Text Messages" = "usage/text-messages.md"},
    {"Google Calendar" = "usage/calendar.md"},
    {"Microsoft Teams" = "usage/teams.md"},
    {"Discord" = "usage/discord.md"},
    {"Beeper" = "usage/beeper.md"},
    {"Slack" = "usage/slack.md"},
    {"Meeting Notes and Transcripts" = "usage/meetings.md"},
  ]},
  {"People and Accounts" = [
    {"People and Profiles" = "usage/people.md"},
    {"Conversation Briefs" = "usage/people-briefs.md"},
    {"Profile Automation" = "usage/people-automation.md"},
    {"External Enrichment" = "usage/people-enrichment.md"},
    {"CardDAV Contacts" = "usage/people-carddav.md"},
    {"Accounts and Collections" = "usage/multi-account.md"},
  ]},
  {"Maintain and Operate" = [
    {"Backup and Restore" = "usage/backup.md"},
    {"Verify Integrity" = "guides/verification.md"},
    {"Deduplication" = "usage/deduplication.md"},
    {"Deleting Email" = "usage/deletion.md"},
    {"Remote Deployment" = "guides/remote-deployment.md"},
    {"Daemon Lifecycle" = "guides/daemon-migration.md"},
    {"Troubleshooting" = "troubleshooting.md"},
  ]},
  {"Reference and Integrations" = [
    {"CLI Reference" = "cli-reference.md"},
    {"Configuration" = "configuration.md"},
    {"HTTP API" = "api-server.md"},
    {"MCP Server" = "usage/chat.md"},
    {"Agent Skills" = "guides/agent-skills.md"},
    {"FAQ" = "faq.md"},
    {"Changelog" = "changelog.md"},
  ]},
  {"Architecture" = [
    {"Overview" = "architecture/overview.md"},
    {"Data Storage" = "architecture/storage.md"},
    {"PostgreSQL Backend" = "architecture/postgresql.md"},
    {"Search Ranking" = "architecture/search-ranking.md"},
    {"Backup Repository Format" = "architecture/backup-format.md"},
  ]},
  {"Development" = "development.md"},
  {"Why msgvault?" = "introduction.md"},
]

[project.extra]
homepage = "/"

[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "assets/static/favicon.svg"
favicon = "assets/static/favicon.svg"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "content.code.copy",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
view = "lucide/file-code"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
